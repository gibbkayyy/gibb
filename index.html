<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.I.B.B. AI OS v3.0</title>
    <style>
        :root {
            --bg-color: #03080c;
            --panel-bg: rgba(5, 12, 20, 0.92);
            --accent-green: #00ff88;
            --accent-cyan: #00e1ff;
            --text-color: #d1f7ff;
            --border-color: rgba(0, 225, 255, 0.25);
            --danger-color: #ff3366;
            --glow-green: 0 0 12px rgba(0, 255, 136, 0.4);
            --glow-cyan: 0 0 12px rgba(0, 225, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 225, 255, 0.05) 0%, transparent 80%),
                repeating-linear-gradient(transparent 0px, transparent 2px, rgba(0, 225, 255, 0.02) 2px, rgba(0, 225, 255, 0.02) 4px);
            background-size: 100% 100%, 100% 4px;
        }

        .main-wrapper {
            width: 98%;
            max-width: 1100px;
            height: 94vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0, 225, 255, 0.15);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ------------------- JARVIS REACTOR LOGO ANIMATION ------------------- */
        .jarvis-logo {
            position: relative;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .jarvis-logo .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top-color: var(--accent-green);
            border-bottom-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: var(--glow-green);
            animation: rotateClockwise 3s linear infinite;
        }

        .jarvis-logo .ring-inner {
            position: absolute;
            width: 60%;
            height: 60%;
            border: 2px solid transparent;
            border-left-color: rgba(0, 225, 255, 0.4);
            border-right-color: rgba(0, 225, 255, 0.4);
            border-radius: 50%;
            animation: rotateAntiClockwise 1.5s linear infinite;
        }

        .jarvis-logo .dot-center {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        @keyframes rotateClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotateAntiClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        /* ------------------- AUTHENTICATION SCREEN ------------------- */
        #auth-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 8, 12, 0.98);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .auth-card {
            background: var(--panel-bg);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0, 225, 255, 0.2);
            padding: 35px;
            border-radius: 4px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .auth-card h1 {
            color: var(--accent-cyan);
            letter-spacing: 4px;
            margin-bottom: 5px;
            font-size: 26px;
        }

        .auth-card p {
            font-size: 12px;
            color: #88a0b0;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--accent-cyan);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 225, 255, 0.2);
            color: var(--accent-green);
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: rgba(0, 225, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: var(--glow-cyan);
        }

        .auth-toggle { margin-top: 15px; font-size: 12px; color: #88a0b0; cursor: pointer; }
        .auth-toggle span { color: var(--accent-cyan); text-decoration: underline; }

        /* ------------------- MAIN HUD INTERFACE ------------------- */
        .header {
            padding: 15px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
        }

        .nav-btn {
            padding: 7px 14px;
            background: transparent;
            border: 1px solid rgba(0, 225, 255, 0.3);
            color: rgba(0, 225, 255, 0.7);
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
        }

        .nav-btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 225, 255, 0.1);
            color: var(--accent-cyan);
        }

        /* ------------------- CAROUSEL NAVIGATION ------------------- */
        .system-carousel {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 15px;
            overflow-x: auto;
        }

        .carousel-item {
            padding: 8px 16px;
            background: rgba(0, 225, 255, 0.05);
            border: 1px solid rgba(0, 225, 255, 0.2);
            color: var(--accent-cyan);
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .carousel-item:hover { border-color: var(--accent-cyan); box-shadow: var(--glow-cyan); }
        .carousel-item.active-item { color: #000; background: var(--accent-cyan); border-color: var(--accent-cyan); font-weight: bold; }

        .main-chat-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message { max-width: 80%; padding: 12px 18px; border-radius: 4px; line-height: 1.6; font-size: 14px; border: 1px solid transparent; }
        .user-msg { align-self: flex-end; background: rgba(0, 225, 255, 0.05); border-color: rgba(0, 225, 255, 0.15); color: #fff; }
        .bot-msg { align-self: flex-start; background: rgba(0, 255, 136, 0.03); border-color: rgba(0, 255, 136, 0.15); color: var(--accent-green); }

        .input-area {
            padding: 18px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
        }

        .input-area input {
            flex: 1;
            padding: 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 225, 255, 0.15);
            color: var(--accent-green);
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        .icon-btn {
            padding: 14px 18px;
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.2);
            color: var(--accent-green);
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .icon-btn:hover { background: rgba(0, 255, 136, 0.15); border-color: var(--accent-green); box-shadow: var(--glow-green); }

        /* ------------------- VOICE ACTIVE SCREEN (HUGE REACTOR HUD) ------------------- */
        #voice-active-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 8, 12, 0.99);
            z-index: 90;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #voice-active-screen .jarvis-logo {
            width: 220px;
            height: 220px;
            margin-bottom: 30px;
        }

        #voice-active-screen .ring-outer { border-width: 5px; box-shadow: 0 0 45px rgba(0, 255, 136, 0.6); }
        #voice-active-screen .ring-inner { border-width: 3px; }
        #voice-active-screen .dot-center { width: 18px; height: 18px; box-shadow: 0 0 25px var(--accent-cyan); }

        .listening-status {
            color: var(--accent-green);
            font-size: 18px;
            letter-spacing: 3px;
            font-weight: bold;
            animation: pulseText 1s infinite;
        }

        .listening-back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        @keyframes pulseText { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* ------------------- SETTINGS MODAL (RESTORED USER LAYOUT) ------------------- */
        .modal { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(3, 8, 12, 0.95); z-index: 50; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--accent-cyan); padding: 30px; border-radius: 4px; width: 90%; max-width: 500px; box-shadow: var(--glow-cyan); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: var(--accent-cyan); letter-spacing: 2px; }
        .close-btn { background: none; border: none; color: var(--danger-color); font-size: 24px; cursor: pointer; }

        .hud-card { display: flex; flex-direction: column; gap: 15px; }
        .setting-group { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .setting-group label { font-size: 0.8rem; font-weight: bold; color: var(--accent-green); text-transform: uppercase; }
        
        .theme-swatches { display: flex; gap: 10px; margin-top: 5px; }
        .swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; transition: transform 0.2s; }
        .swatch:hover { transform: scale(1.1); }

        .settings-btn { padding: 10px; background: rgba(0, 255, 136, 0.1); border: 1px solid var(--accent-green); color: var(--accent-green); cursor: pointer; border-radius: 4px; font-weight: bold; }
        .settings-btn:hover { background: var(--accent-green); color: #000; }
        
        input[type="range"] { width: 100%; accent-color: var(--accent-green); cursor: pointer; }
    </style>
</head>
<body>

    <div class="main-wrapper">

        <div id="auth-screen">
            <div class="auth-card">
                <h1 id="auth-title">G.I.B.B. OS</h1>
                <p id="auth-sub">INITIALIZE SYSTEM LOGIN</p>
                
                <div id="auth-error" style="color: var(--danger-color); font-size: 12px; margin-bottom: 10px; display: none;"></div>

                <div class="input-group" id="name-group" style="display: none;">
                    <label>USER DESIGNATION / NAME</label>
                    <input type="text" id="auth-name" placeholder="User / Operator">
                </div>

                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" id="auth-email" placeholder="operator@domain.com">
                </div>

                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="auth-password" placeholder="••••••••">
                </div>

                <div class="input-group" id="gender-group" style="display: none;">
                    <label>GENDER (ADDRESS PROTOCOL)</label>
                    <select id="auth-gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <button class="btn" id="auth-btn" onclick="handleAuth()">AUTHENTICATE</button>

                <div class="auth-toggle" onclick="toggleAuthMode()">
                    <span id="toggle-text">Need an account? Register System Profile</span>
                </div>
            </div>
        </div>

        <div id="voice-active-screen">
            <button class="nav-btn listening-back-btn" onclick="deactivateVoiceActiveScreen()">❌ CANCEL</button>
            <div class="jarvis-logo">
                <div class="ring-outer"></div>
                <div class="ring-inner"></div>
                <div class="dot-center"></div>
            </div>
            <p class="listening-status" style="margin-top: 30px;">AWAITING COMMAND...</p>
        </div>

        <div class="header">
            <div class="user-status">
                <div class="jarvis-logo">
                    <div class="ring-outer"></div>
                    <div class="ring-inner"></div>
                    <div class="dot-center"></div>
                </div>
                <div style="display: flex; flex-direction: column;">
                    <span style="font-weight: bold; letter-spacing: 2px; color: var(--accent-cyan);">G.I.B.B. HUD</span>
                    <span id="display-user" style="color: rgba(0, 225, 255, 0.7); font-size: 11px;">System Offline</span>
                </div>
            </div>
            <div class="user-status">
                <button class="nav-btn" onclick="openSettings()">⚙️ SETTINGS</button>
                <button class="nav-btn" style="border-color: var(--danger-color); color: var(--danger-color);" onclick="logout()">SHUTDOWN</button>
            </div>
        </div>

        <div class="system-carousel">
            <div class="carousel-item active-item">Main Chat</div>
            <div class="carousel-item" onclick="activateVoiceActiveScreen()">Voice Control</div>
            <div class="carousel-item" onclick="openSettings()">System Config</div>
            <div class="carousel-item" onclick="clearCurrentChat()">Clear History</div>
        </div>

        <div class="main-chat-screen" id="main-chat-screen">
            <div class="chat-box" id="chat-box">
                <div class="message bot-msg">
                    System initialized. Welcome back.
                </div>
            </div>

            <div class="input-area">
                <button class="icon-btn" onclick="toggleTextVoiceInput()" id="mic-btn">🎙️</button>
                <input type="text" id="user-input" placeholder="Enter command or speak to G.I.B.B..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="icon-btn" onclick="sendMessage()">SEND ➣</button>
            </div>
        </div>

        <div class="modal" id="settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 style="color: var(--accent-green); border-bottom: 1px solid var(--accent-green); padding-bottom: 8px; width: 100%;">⚙️ SYSTEM SETTINGS</h4>
                    <button class="close-btn" onclick="closeSettings()">&times;</button>
                </div>
                
                <div class="hud-card">
                    <div style="background: #000c03; border: 2px solid var(--accent-green); padding: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-size: 0.8rem; font-weight: bold; color: var(--accent-green);">⚡ Groq API Key</label>
                        <input type="password" id="groq-key-input" placeholder="gsk_..." oninput="saveGroqKey(this.value)" style="width: 100%; background: #010a04; color: var(--accent-green); border: 1px solid var(--accent-green); padding: 10px; border-radius: 4px; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; outline: none;">
                    </div>

                    <div class="setting-group">
                        <label>🎨 HUD Theme / Color</label>
                        <div class="theme-swatches">
                            <div class="swatch" style="background: #00ff66;" onclick="setTheme('#00ff66', 'rgba(0,255,100,0.8)')"></div>
                            <div class="swatch" style="background: #00bfff;" onclick="setTheme('#00bfff', 'rgba(0,191,255,0.8)')"></div>
                            <div class="swatch" style="background: #ffaa00;" onclick="setTheme('#ffaa00', 'rgba(255,170,0,0.8)')"></div>
                            <div class="swatch" style="background: #ff3366;" onclick="setTheme('#ff3366', 'rgba(255,51,102,0.8)')"></div>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label>🔊 Audio Mute Toggle</label>
                        <button class="settings-btn" id="mute-btn" onclick="toggleMute()">MUTE: OFF</button>
                    </div>

                    <div class="setting-group">
                        <label>🎚️ Master Volume: <span id="vol-val">100%</span></label>
                        <input type="range" id="volume-slider" min="0" max="100" value="100" oninput="updateVolume(this.value)">
                    </div>

                    <div class="setting-group">
                        <label>USER EMAIL (READ ONLY)</label>
                        <input type="text" id="profile-email-input" readonly style="opacity: 0.6; color: var(--text-color); background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); padding: 10px; border-radius: 4px;">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let isSignUp = false;
        let currentUser = null;
        let conversationHistory = [];
        let permanentVoiceHandler = null;
        let isMuted = false;
        let masterVolume = 1.0;

        // Load account session on startup
        window.addEventListener('load', () => {
            const savedSession = localStorage.getItem('gibb_v3_session');
            if (savedSession) {
                currentUser = JSON.parse(savedSession);
                initInterface();
                startPermanentWakeWordListener();
            }
        });

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "REGISTER PROFILE" : "G.I.B.B. OS";
            document.getElementById('auth-sub').innerText = isSignUp ? "NEW OPERATOR REGISTRATION" : "SIGN IN TO YOUR ACCOUNT";
            document.getElementById('auth-btn').innerText = isSignUp ? "CREATE ACCOUNT" : "AUTHENTICATE";
            document.getElementById('name-group').style.display = isSignUp ? "block" : "none";
            document.getElementById('gender-group').style.display = isSignUp ? "block" : "none";
            document.getElementById('toggle-text').innerText = isSignUp ? "Already have a profile? Login" : "Need an account? Register Profile";
            document.getElementById('auth-error').style.display = "none";
        }

        function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const name = document.getElementById('auth-name').value.trim() || "Operator";
            const gender = document.getElementById('auth-gender').value;
            const errDiv = document.getElementById('auth-error');

            if (!email || !password) {
                errDiv.innerText = "Error: Email and Password required.";
                errDiv.style.display = "block";
                return;
            }

            let accounts = JSON.parse(localStorage.getItem('gibb_v3_accounts')) || {};

            if (isSignUp) {
                if (accounts[email]) {
                    errDiv.innerText = "Error: Account already exists.";
                    errDiv.style.display = "block";
                    return;
                }
                accounts[email] = { name, email, password, gender, groqApiKey: "", history: [] };
                localStorage.setItem('gibb_v3_accounts', JSON.stringify(accounts));
                currentUser = accounts[email];
            } else {
                if (!accounts[email] || accounts[email].password !== password) {
                    errDiv.innerText = "Authentication Failure: Check credentials.";
                    errDiv.style.display = "block";
                    return;
                }
                currentUser = accounts[email];
            }

            localStorage.setItem('gibb_v3_session', JSON.stringify(currentUser));
            initInterface();
            startPermanentWakeWordListener();
        }

        function initInterface() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('display-user').innerText = `USER: ${currentUser.name.toUpperCase()}`;
            document.getElementById('groq-key-input').value = currentUser.groqApiKey || "";
            document.getElementById('profile-email-input').value = currentUser.email;

            const salutation = currentUser.gender === 'female' ? 'miss' : 'sir';

            // Load persistent chat history for this specific account
            conversationHistory = [
                {
                    role: "system",
                    content: `You are G.I.B.B., a highly intelligent, direct, and helpful AI assistant. Address the user as ${currentUser.name} and use the polite salutation ${salutation}. Keep your responses direct, concise, smart, and professional.`
                }
            ];

            if (currentUser.history && currentUser.history.length > 0) {
                // Restore past conversation items
                currentUser.history.forEach(msg => {
                    conversationHistory.push(msg);
                    if (msg.role !== 'system') {
                        appendMessage(msg.content, msg.role === 'user' ? 'user-msg' : 'bot-msg', false);
                    }
                });
            } else {
                appendMessage(`Ready when you are, ${salutation}.`, 'bot-msg');
            }

            speakJarvis(`Ready when you are, ${salutation}.`);
        }

        function logout() {
            saveAccountHistory();
            localStorage.removeItem('gibb_v3_session');
            location.reload();
        }

        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveGroqKey(val) {
            currentUser.groqApiKey = val.trim();
            updateAccountStorage();
        }

        function updateAccountStorage() {
            let accounts = JSON.parse(localStorage.getItem('gibb_v3_accounts')) || {};
            if (accounts[currentUser.email]) {
                accounts[currentUser.email].groqApiKey = currentUser.groqApiKey;
                accounts[currentUser.email].history = currentUser.history;
                localStorage.setItem('gibb_v3_accounts', JSON.stringify(accounts));
            }
            localStorage.setItem('gibb_v3_session', JSON.stringify(currentUser));
        }

        function saveAccountHistory() {
            // Filter out system prompt for permanent save
            currentUser.history = conversationHistory.filter(m => m.role !== 'system');
            updateAccountStorage();
        }

        function clearCurrentChat() {
            conversationHistory = [conversationHistory[0]]; // Keep system prompt
            currentUser.history = [];
            updateAccountStorage();
            document.getElementById('chat-box').innerHTML = '<div class="message bot-msg">Memory wiped. Ready for new input.</div>';
        }

        function setTheme(color, glow) {
            document.documentElement.style.setProperty('--accent-green', color);
            document.documentElement.style.setProperty('--glow-green', `0 0 12px ${glow}`);
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mute-btn').innerText = `MUTE: ${isMuted ? 'ON' : 'OFF'}`;
        }

        function updateVolume(val) {
            masterVolume = val / 100;
            document.getElementById('vol-val').innerText = `${val}%`;
        }

        function appendMessage(text, className, save = true) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (save && currentUser) {
                const role = className.includes('user-msg') ? 'user' : 'assistant';
                currentUser.history.push({ role, content: text });
                saveAccountHistory();
            }
            return msgDiv;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user-msg');
            inputField.value = '';

            if (!currentUser.groqApiKey) {
                appendMessage("API key missing. Please check system settings.", 'bot-msg');
                speakJarvis("API key missing. Please check system settings.");
                return;
            }

            conversationHistory.push({ role: "user", content: text });
            let loadingDots = appendMessage('...', 'bot-msg', false);

            try {
                let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${currentUser.groqApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                let data = await res.json();
                document.getElementById('chat-box').removeChild(loadingDots);

                if (data.choices && data.choices.length > 0) {
                    let reply = data.choices[0].message.content;
                    conversationHistory.push({ role: "assistant", content: reply });
                    appendMessage(reply, 'bot-msg');
                    speakJarvis(reply);
                } else {
                    appendMessage("System Error: Invalid AI response.", 'bot-msg');
                }
            } catch (err) {
                document.getElementById('chat-box').removeChild(loadingDots);
                appendMessage("Connection Error: Unable to reach server cluster.", 'bot-msg');
            }
        }

        function speakJarvis(text) {
            if (isMuted || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let cleanText = text.replace(/[*#_`]/g, '');
            let utter = new SpeechSynthesisUtterance(cleanText);
            utter.rate = 1.1; 
            utter.pitch = 0.95;
            utter.volume = masterVolume;
            window.speechSynthesis.speak(utter);
        }

        // Voice Control Protocols
        function toggleTextVoiceInput() {
            if (!('webkitSpeechRecognition' in window)) { alert("Speech recognition not supported."); return; }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            const micBtn = document.getElementById('mic-btn');
            micBtn.style.color = '#ff3366';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                micBtn.style.color = 'var(--accent-green)';
                sendMessage();
            };

            recognition.onerror = recognition.onend = () => {
                micBtn.style.color = 'var(--accent-green)';
            };

            recognition.start();
        }

        function activateVoiceActiveScreen() {
            document.getElementById('voice-active-screen').style.display = 'flex';
            document.getElementById('main-chat-screen').style.display = 'none';

            const salutation = currentUser.gender === 'female' ? 'miss' : 'sir';
            speakJarvis(`Awaiting your command, ${salutation}.`);

            startListeningForActiveCommand();
        }

        function deactivateVoiceActiveScreen() {
            document.getElementById('voice-active-screen').style.display = 'none';
            document.getElementById('main-chat-screen').style.display = 'flex';
        }

        function startPermanentWakeWordListener() {
            if (!('webkitSpeechRecognition' in window) || permanentVoiceHandler != null) return;
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            permanentVoiceHandler = new SpeechRecognition();
            permanentVoiceHandler.continuous = true;
            permanentVoiceHandler.lang = 'en-US';

            permanentVoiceHandler.onresult = (event) => {
                const resultIndex = event.resultIndex;
                const transcript = event.results[resultIndex][0].transcript.trim().toLowerCase();

                if (transcript.includes('activate voice control') || transcript.includes('do voice control')) {
                    activateVoiceActiveScreen();
                }
            };

            permanentVoiceHandler.onerror = (err) => {
                if(err.error === 'no-speech') return;
            };

            permanentVoiceHandler.onend = () => {
                if (currentUser) permanentVoiceHandler.start(); 
            };

            permanentVoiceHandler.start();
        }

        function startListeningForActiveCommand() {
            if (!('webkitSpeechRecognition' in window)) return;
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const commandRecognition = new SpeechRecognition();
            commandRecognition.lang = 'en-US';

            commandRecognition.onresult = (event) => {
                const commandText = event.results[0][0].transcript.trim().toLowerCase();
                handleVoiceCommandInput(commandText);
                deactivateVoiceActiveScreen();
            };

            commandRecognition.onerror = () => {
                deactivateVoiceActiveScreen();
            };

            commandRecognition.start();
        }

        function handleVoiceCommandInput(command) {
            if (command.includes('weather')) {
                pullUpWeatherPlaceHolder();
            } else if (command.includes('news')) {
                pullUpNewsPlaceholder();
            } else if (command.includes('map') || command.includes('maps')) {
                pullUpGoogleMapsPlaceholder(command);
            } else {
                document.getElementById('user-input').value = command;
                sendMessage();
            }
        }

        function pullUpWeatherPlaceHolder() {
            appendMessage(`Accessing weather protocols... *Add API key for live feed.*`, 'bot-msg');
            speakJarvis(`Opening weather interface.`);
        }

        function pullUpNewsPlaceholder() {
            appendMessage(`Accessing news headlines... *Add API key for live feed.*`, 'bot-msg');
            speakJarvis(`Fetching current news briefings.`);
        }

        function pullUpGoogleMapsPlaceholder(command) {
            appendMessage(`Accessing Google Maps protocols...`, 'bot-msg');
            speakJarvis(`Initializing map search.`);
            const mapQuery = command.replace('map of', '').replace('open map for', '').replace('maps', '').trim();
            if (mapQuery) {
                window.open(`https://www.google.com/maps/search/${encodeURIComponent(mapQuery)}`, '_blank');
            } else {
                window.open(`https://www.google.com/maps`, '_blank');
            }
        }
    </script>
</body>
</html>
