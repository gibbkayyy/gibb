<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.I.B.B. System - Secure Core</title>
    <style>
        :root {
            --bg-color: #030803;
            --panel-bg: rgba(0, 20, 0, 0.92);
            --border-color: rgba(0, 255, 0, 0.45);
            --text-color: #00ff00;
            --accent-color: #00ff00;
            --accent-glow: rgba(0, 255, 0, 0.6);
            --danger-color: #ff4444;

            --chat-bg: #e6ffec;
            --chat-text: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated Tech Grid Background */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 25s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-40px, -40px); }
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1;
        }

        .screen.active {
            display: flex;
        }

        /* Perfectly Centered Logo with Inner Designs & Orbiting Rings */
        .logo-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .gibb-text-logo {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            z-index: 10;
            text-shadow: 0 0 20px var(--accent-glow);
            letter-spacing: 3px;
            text-align: center;
            width: 100%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Cool Inner Design Pattern inside rings */
        .inner-design-grid {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px dotted rgba(0, 255, 0, 0.3);
            background: radial-gradient(circle, rgba(0,255,0,0.08) 0%, transparent 70%);
            animation: pulseCore 4s ease-in-out infinite;
        }

        @keyframes pulseCore {
            0%, 100% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* Outer Orbiting Ring (Clockwise) */
        .orbit-ring-outer {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 0, 0.6);
            animation: spinClockwise 12s linear infinite;
        }

        .dot-outer {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-color);
            top: -5px;
            left: calc(50% - 5px);
        }

        /* Inner Orbiting Ring (Anti-Clockwise) */
        .orbit-ring-inner {
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            border: 1px dashed rgba(0, 255, 0, 0.4);
            animation: spinCounterClockwise 8s linear infinite;
        }

        .dot-inner {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: rgba(0, 255, 0, 0.8);
            border-radius: 50%;
            bottom: -3px;
            left: calc(50% - 3px);
        }

        @keyframes spinClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinCounterClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Panels & Forms */
        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.15);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            background: rgba(0, 255, 0, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        select option {
            background: var(--bg-color);
            color: var(--text-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: rgba(0, 255, 0, 0.2);
            color: var(--accent-color);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: rgba(0, 255, 0, 0.4);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .error-msg {
            color: var(--danger-color);
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }

        /* Main Menu Layout (Settings Left, Location Right) */
        .main-menu-layout {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            width: 100vw;
            height: 100vh;
            padding: 30px;
            gap: 30px;
            align-items: center;
        }

        .sidebar-panel {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .widget-box {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .widget-title {
            font-size: 0.85rem;
            color: #88ff88;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .center-menu-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .carousel-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 120px;
            margin-top: 10px;
        }

        .carousel-btn {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            color: var(--accent-color);
            padding: 15px 25px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-weight: bold;
        }

        .carousel-btn.small {
            transform: scale(0.8);
            opacity: 0.4;
            font-size: 0.9rem;
        }

        .carousel-btn.big {
            transform: scale(1.1);
            opacity: 1;
            font-size: 1.2rem;
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Fullscreen Chat Interface */
        .chat-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            color: var(--chat-text);
            overflow: hidden;
            border: none;
            z-index: 2;
        }

        .chat-header {
            padding: 15px 30px;
            background: #cdffda;
            border-bottom: 1px solid #a3e0b2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #004d00;
        }

        .chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
            font-family: inherit;
        }

        .message.user {
            background: #006400; 
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.gibb {
            background: #f0fff4;
            color: var(--chat-text);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #d4edda;
        }

        .chat-input-area {
            display: flex;
            padding: 20px 30px;
            border-top: 1px solid #a3e0b2;
            background: #f0fff4;
            gap: 15px;
        }

        .chat-input-area input {
            margin-bottom: 0;
            background: #ffffff;
            color: #000000;
            border: 1px solid #a3e0b2;
        }

        .chat-input-area button {
            width: 120px;
            margin-bottom: 0;
            background: #006400;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen active">
        <div class="logo-container">
            <div class="inner-design-grid"></div>
            <div class="orbit-ring-outer"><div class="dot-outer"></div></div>
            <div class="orbit-ring-inner"><div class="dot-inner"></div></div>
            <div class="gibb-text-logo">G.I.B.B.</div>
        </div>
        
        <div class="panel">
            <h2 style="margin-bottom: 15px; letter-spacing: 2px;">INITIALIZE PROFILE</h2>
            <div id="auth-error" class="error-msg"></div>
            
            <input type="text" id="username-input" placeholder="Enter Username">
            
            <select id="gender-input">
                <option value="" disabled selected>Select Title Preference</option>
                <option value="sir">Male (Sir)</option>
                <option value="miss">Female (Miss)</option>
            </select>

            <button class="btn" onclick="initializeProfile()">ESTABLISH CONNECTION</button>
        </div>
    </div>

    <div id="menu-screen" class="screen">
        <div class="main-menu-layout">
            
            <div class="sidebar-panel">
                <div>
                    <h3 style="margin-bottom: 20px; text-shadow: 0 0 10px var(--accent-glow);">CORE SETTINGS</h3>
                    <div class="widget-box">
                        <div class="widget-title">Access Key Input</div>
                        <input type="text" id="access-key-input" placeholder="Enter key..." style="margin-bottom: 8px; font-size: 0.85rem; padding: 8px;" value="gibb">
                        <p style="font-size: 0.75rem; color: #88ff88;">Key provides secure system entry.</p>
                    </div>
                    <div class="widget-box">
                        <div class="widget-title">Remembrance Status</div>
                        <p style="font-size: 0.85rem; color: #10b981;">✓ Chats remembered permanently.</p>
                    </div>
                </div>
                <div>
                    <button class="btn" style="border-color: var(--danger-color); color: #ff8888; font-size: 0.85rem;" onclick="clearProfileData()">RESET PROFILE</button>
                </div>
            </div>

            <div class="center-menu-panel">
                <div class="logo-container">
                    <div class="inner-design-grid"></div>
                    <div class="orbit-ring-outer"><div class="dot-outer"></div></div>
                    <div class="orbit-ring-inner"><div class="dot-inner"></div></div>
                    <div class="gibb-text-logo">G.I.B.B.</div>
                </div>

                <div class="carousel-container" id="carousel">
                    <button class="carousel-btn big" id="c-btn-0" onclick="selectCarouselOption(0)">Launch Chat</button>
                    <button class="carousel-btn small" id="c-btn-1" onclick="selectCarouselOption(1)">Data Core</button>
                </div>
            </div>

            <div class="sidebar-panel">
                <div>
                    <h3 style="margin-bottom: 20px; text-shadow: 0 0 10px var(--accent-glow);">HUD MODULE</h3>
                    <div class="widget-box">
                        <div class="widget-title">Location</div>
                        <p style="font-size: 1rem; font-weight: bold;">Sector: Secure Node 01</p>
                    </div>
                    <div class="widget-box">
                        <div class="widget-title">Display Metrics</div>
                        <p style="font-size: 0.9rem;">FPS: <span id="fps-counter">60</span></p>
                        <p style="font-size: 0.9rem; margin-top: 5px;">RES: <span id="res-display">1920x1080</span></p>
                    </div>
                </div>
                <div class="widget-box" style="margin-bottom: 0;">
                    <div class="widget-title">Status</div>
                    <p style="font-size: 0.85rem; color: #10b981;">CONNECTED</p>
                </div>
            </div>
        </div>
    </div>

    <div id="dashboard-screen" class="screen">
        <div class="chat-container">
            <div class="chat-header">
                <span style="font-weight: bold; letter-spacing: 2px;">G.I.B.B. NEURAL CONNECT</span>
                <button style="background: #006400; border: none; color: white; cursor: pointer; padding: 6px 12px; border-radius: 4px;" onclick="openMenu()">SYSTEM MENU</button>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message to G.I.B.B...." onkeypress="checkEnter(event)">
                <button class="btn" onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        let carouselIndex = 0;
        
        // Permanent persistent storage database
        let db = JSON.parse(localStorage.getItem('gibb_permanent_db')) || { 
            profile: null,
            chatHistory: [] 
        };

        window.addEventListener('DOMContentLoaded', () => {
            updateResolution();
            window.addEventListener('resize', updateResolution);
            
            // FPS counter loop
            let frameCount = 0;
            let lastTime = performance.now();
            function countFPS() {
                frameCount++;
                let currentTime = performance.now();
                if (currentTime - lastTime >= 1000) {
                    const fpsEl = document.getElementById('fps-counter');
                    if(fpsEl) fpsEl.innerText = frameCount;
                    frameCount = 0;
                    lastTime = currentTime;
                }
                requestAnimationFrame(countFPS);
            }
            requestAnimationFrame(countFPS);

            // Check if profile exists; stay logged in permanently unless user clears it
            if (db.profile && db.profile.honorific) {
                showMenuScreen();
            } else {
                showAuthScreen();
            }
        });

        function updateResolution() {
            const display = document.getElementById('res-display');
            if(display) display.innerText = `${window.innerWidth}x${window.innerHeight}`;
        }

        function initializeProfile() {
            const user = document.getElementById('username-input').value.trim();
            const honorific = document.getElementById('gender-input').value;
            const errorBox = document.getElementById('auth-error');

            if (!honorific) {
                errorBox.innerText = "Please select your title preference (Sir or Miss).";
                errorBox.style.display = 'block';
                return;
            }

            db.profile = { name: user || "User", honorific: honorific };
            saveDatabase();
            showMenuScreen();
        }

        function saveDatabase() {
            localStorage.setItem('gibb_permanent_db', JSON.stringify(db));
        }

        function showAuthScreen() {
            document.getElementById('auth-screen').classList.add('active');
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('dashboard-screen').classList.remove('active');
        }

        function showMenuScreen() {
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
            document.getElementById('dashboard-screen').classList.remove('active');
        }

        function openMenu() {
            showMenuScreen();
        }

        // Carousel Logic
        function selectCarouselOption(index) {
            carouselIndex = index;
            updateCarouselUI();
            if (index === 0) {
                setTimeout(showDashboard, 300);
            }
        }

        function updateCarouselUI() {
            const btn0 = document.getElementById('c-btn-0');
            const btn1 = document.getElementById('c-btn-1');
            if (!btn0 || !btn1) return;
            if (carouselIndex === 0) {
                btn0.className = "carousel-btn big";
                btn1.className = "carousel-btn small";
            } else {
                btn0.className = "carousel-btn small";
                btn1.className = "carousel-btn big";
            }
        }

        window.addEventListener('wheel', (e) => {
            if (document.getElementById('menu-screen').classList.contains('active')) {
                if (e.deltaY > 0) carouselIndex = 1; else carouselIndex = 0;
                updateCarouselUI();
            }
        });

        function showDashboard() {
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('dashboard-screen').classList.add('active');
            loadChatHistory();
        }

        function loadChatHistory() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            const history = db.chatHistory || [];
            const honorific = db.profile && db.profile.honorific === 'sir' ? 'Sir' : 'Miss';
            
            if (history.length === 0) {
                appendMessage(`System Core initialized, ${honorific}. Secure channel established.`, 'gibb', false);
            } else {
                history.forEach(msg => {
                    appendMessage(msg.text, msg.sender, false);
                });
            }
        }

        function appendMessage(text, sender, save = true) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            if (save) {
                db.chatHistory.push({ text, sender });
                saveDatabase();
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            setTimeout(() => {
                const honorific = db.profile && db.profile.honorific === 'sir' ? 'Sir' : 'Miss';
                const lowerText = text.toLowerCase();
                let reply = "";

                if (lowerText.includes('who made you') || lowerText.includes('creator') || lowerText.includes('created you')) {
                    reply = `gibbkayyy made me, ${honorific}.`;
                } else {
                    reply = `Acknowledged, ${honorific}. Permanent history remembrance is active.`;
                }

                appendMessage(reply, 'gibb');
            }, 600);
        }

        // Only clears when user explicitly requests via reset button
        function clearProfileData() {
            if (confirm("Are you sure you want to reset your profile and chat memory?")) {
                localStorage.removeItem('gibb_permanent_db');
                db = { profile: null, chatHistory: [] };
                showAuthScreen();
            }
        }
    </script>
</body>
</html>
