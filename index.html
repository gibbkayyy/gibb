<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GibbAI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --border-color: #cbd5e1;
        }

        [data-theme="neon"] {
            --bg-color: #050505;
            --card-bg: #121212;
            --text-color: #00ffcc;
            --accent-color: #ff007f;
            --accent-hover: #cc0066;
            --border-color: #ff007f;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .nav-buttons button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            margin-left: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .nav-buttons button:hover {
            background-color: var(--accent-hover);
        }

        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .page.active {
            display: block;
        }

        select, input {
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin-top: 0.5rem;
            width: 100%;
            max-width: 300px;
        }

        #voice-status {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
            font-style: italic;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <h1>GibbAI</h1>
        <div class="nav-buttons">
            <button onclick="showPage('menu')">Menu</button>
            <button onclick="showPage('chat')">Chat</button>
            <button onclick="showPage('translation')">Translation</button>
            <button onclick="showPage('settings')">Settings</button>
        </div>
    </header>

    <main>
        <div id="page-menu" class="page active">
            <h2>Welcome to GibbAI</h2>
            <p>Use navigation or say <strong>"Hey Gibb"</strong> followed by commands like <strong>"open chat"</strong>, <strong>"open translation"</strong>, or <strong>"menu"</strong>.</p>
            <div id="voice-status">Voice Command: Initializing...</div>
        </div>

        <div id="page-chat" class="page">
            <h2>Chat Page</h2>
            <p>Type your thoughts or chat away here.</p>
            <textarea placeholder="Type a message..." style="width: 100%; height: 100px; margin-top: 1rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); padding: 0.5rem;"></textarea>
        </div>

        <div id="page-translation" class="page">
            <h2>Translation Page</h2>
            <p>Translate text seamlessly.</p>
            <input type="text" placeholder="Text to translate..." />
        </div>

        <div id="page-settings" class="page">
            <h2>Settings</h2>
            <label for="theme-select"><strong>Color Theme:</strong></label><br>
            <select id="theme-select" onchange="changeTheme(this.value)">
                <option value="dark">Dark Mode</option>
                <option value="light">Light Mode</option>
                <option value="neon">Neon Cyber</option>
            </select>
        </div>
    </main>

    <script>
        // Page Navigation Logic
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById('page-' + pageId);
            if (target) target.classList.add('active');
        }

        // Theme Switcher Logic
        function changeTheme(themeName) {
            document.body.setAttribute('data-theme', themeName);
            localStorage.setItem('gibb_theme', themeName);
        }

        // Load saved theme on startup
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('gibb_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-select').value = savedTheme;
            initVoiceRecognition();
        });

        // Voice Command Integration with Stability Fixes
        function initVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('voice-status').innerText = "Voice commands not supported in this browser.";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = false; // Changed to false to prevent endless overlapping streams
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            let isListeningForCommand = false;

            recognition.onstart = () => {
                document.getElementById('voice-status').innerText = 'Listening for "Hey Gibb"...';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                document.getElementById('voice-status').innerText = `Heard: "${transcript}"`;

                // Wake word variations (including phonetic spelling fixes)
                if (transcript.includes('hey gib') || transcript.includes('hey gibb') || transcript.includes('a gib') || transcript.includes('hey jib')) {
                    isListeningForCommand = true;
                    document.getElementById('voice-status').innerText = `Wake word detected! Give command ("open chat", "menu", etc.)...`;
                    return;
                }

                // Execute navigation commands
                if (isListeningForCommand || transcript.includes('launch') || transcript.includes('open') || transcript.includes('close') || transcript.includes('stop') || transcript === 'menu' || transcript === 'chat' || transcript === 'translation') {
                    
                    if (transcript.includes('launch chat') || transcript.includes('open chat') || transcript === 'chat') {
                        showPage('chat');
                        isListeningForCommand = false;
                    } 
                    else if (transcript.includes('close chat') || transcript.includes('stop chat')) {
                        showPage('menu');
                        isListeningForCommand = false;
                    } 
                    else if (transcript.includes('open translation') || transcript === 'translation') {
                        showPage('translation');
                        isListeningForCommand = false;
                    } 
                    else if (transcript.includes('close translation') || transcript.includes('stop translation')) {
                        showPage('menu');
                        isListeningForCommand = false;
                    } 
                    else if (transcript.includes('menu')) {
                        showPage('menu');
                        isListeningForCommand = false;
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
            };

            recognition.onend = () => {
                // Add a brief delay before restarting to stop the aggressive flashing loop
                setTimeout(() => {
                    try {
                        recognition.start();
                    } catch (e) {
                        // Suppress errors if already started
                    }
                }, 800);
            };

            try {
                recognition.start();
            } catch (e) {
                console.log("Speech recognition start failed", e);
            }
        }
    </script>
</body>
</html>
