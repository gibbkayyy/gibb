<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.I.B.B. System - Secure Core</title>
    <style>
        :root {
            --bg-color: #030803;
            --panel-bg: rgba(0, 20, 0, 0.92);
            --border-color: rgba(0, 255, 0, 0.45);
            --text-color: #00ff00;
            --accent-color: #00ff00;
            --accent-glow: rgba(0, 255, 0, 0.6);
            --danger-color: #ff4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated Tech Grid Background */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 25s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-40px, -40px); }
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1;
        }

        .screen.active {
            display: flex;
        }

        /* Logo Design */
        .logo-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .gibb-text-logo {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            z-index: 10;
            text-shadow: 0 0 20px var(--accent-glow);
            letter-spacing: 4px;
            /* Shifted slightly more to the right to perfectly balance the letter-spacing offset */
            transform: translateX(6px); 
            text-align: center;
            position: absolute;
        }

        .inner-design-grid {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px dotted rgba(0, 255, 0, 0.3);
            background: radial-gradient(circle, rgba(0,255,0,0.08) 0%, transparent 70%);
            animation: pulseCore 4s ease-in-out infinite;
        }

        @keyframes pulseCore {
            0%, 100% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .orbit-ring-outer {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 0, 0.6);
            animation: spinClockwise 12s linear infinite;
        }
        .dot-outer {
            position: absolute; width: 10px; height: 10px; background-color: var(--accent-color);
            border-radius: 50%; box-shadow: 0 0 10px var(--accent-color); top: -5px; left: calc(50% - 5px);
        }

        .orbit-ring-inner {
            position: absolute; width: 190px; height: 190px; border-radius: 50%;
            border: 1px dashed rgba(0, 255, 0, 0.4); animation: spinCounterClockwise 8s linear infinite;
        }
        .dot-inner {
            position: absolute; width: 6px; height: 6px; background-color: rgba(0, 255, 0, 0.8);
            border-radius: 50%; bottom: -3px; left: calc(50% - 3px);
        }

        @keyframes spinClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinCounterClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        /* Panels & Forms */
        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.15);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        input, select {
            width: 100%; padding: 12px 16px; margin-bottom: 15px;
            background: rgba(0, 255, 0, 0.08); border: 1px solid var(--border-color);
            border-radius: 4px; color: var(--text-color); font-size: 1rem; outline: none;
        }
        input:focus, select:focus { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }
        select option { background: var(--bg-color); color: var(--text-color); }

        input[type="range"] {
            -webkit-appearance: none; width: 100%; background: rgba(0, 255, 0, 0.1);
            height: 6px; border-radius: 3px; outline: none; border: 1px solid var(--border-color);
            margin: 10px 0; padding: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: var(--accent-color); cursor: pointer; box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn {
            width: 100%; padding: 12px; background: rgba(0, 255, 0, 0.2);
            color: var(--accent-color); border: 2px solid var(--border-color);
            border-radius: 4px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s;
        }
        .btn:hover { background: rgba(0, 255, 0, 0.4); box-shadow: 0 0 15px var(--accent-glow); }

        .error-msg { color: var(--danger-color); font-size: 0.85rem; margin-bottom: 15px; display: none; }

        /* Main Menu Layout */
        .main-menu-layout {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            width: 100vw; height: 100vh; padding: 30px; gap: 30px; align-items: center;
        }

        .sidebar-panel {
            background: var(--panel-bg); border: 2px solid var(--border-color);
            border-radius: 12px; padding: 25px; height: 100%; display: flex;
            flex-direction: column; justify-content: space-between; backdrop-filter: blur(10px);
        }

        .widget-box {
            background: rgba(0, 255, 0, 0.05); border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 8px; padding: 15px; margin-bottom: 15px;
        }
        .widget-title {
            font-size: 0.85rem; color: #88ff88; text-transform: uppercase;
            margin-bottom: 8px; letter-spacing: 1px; font-weight: bold;
        }

        .center-menu-panel {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%;
        }

        .carousel-container {
            display: flex; align-items: center; justify-content: center;
            gap: 20px; height: 120px; margin-top: 10px;
        }

        .carousel-btn {
            background: var(--panel-bg); border: 2px solid var(--border-color);
            color: var(--accent-color); padding: 15px 25px; border-radius: 4px;
            cursor: pointer; transition: all 0.4s ease; font-weight: bold;
        }
        .carousel-btn.small { transform: scale(0.8); opacity: 0.4; font-size: 0.9rem; }
        .carousel-btn.big { transform: scale(1.1); opacity: 1; font-size: 1.2rem; border-color: var(--accent-color); box-shadow: 0 0 20px var(--accent-glow); }

        /* Chat Interface */
        .chat-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            background: transparent; color: var(--text-color); overflow: hidden;
        }

        .chat-header {
            padding: 20px 30px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; color: var(--accent-color);
            backdrop-filter: blur(10px);
        }

        .chat-messages {
            flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
            background: rgba(0, 10, 0, 0.7); backdrop-filter: blur(5px);
        }

        .message {
            max-width: 75%; padding: 14px 18px; border-radius: 8px; font-size: 1rem; line-height: 1.5;
        }
        .message.user {
            background: var(--accent-color); color: #000000; align-self: flex-end;
            border-bottom-right-radius: 2px; font-weight: bold;
        }
        .message.gibb {
            background: rgba(0, 255, 0, 0.05); color: var(--text-color); align-self: flex-start;
            border-bottom-left-radius: 2px; border: 1px solid var(--border-color); box-shadow: 0 0 10px rgba(0,255,0,0.1);
        }

        .chat-input-area {
            display: flex; padding: 20px 30px; border-top: 1px solid var(--border-color);
            background: var(--panel-bg); gap: 15px; backdrop-filter: blur(10px);
        }
        .chat-input-area input { margin-bottom: 0; }
        .chat-input-area button { width: 120px; margin-bottom: 0; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen">
        <div class="logo-container">
            <div class="inner-design-grid"></div>
            <div class="orbit-ring-outer"><div class="dot-outer"></div></div>
            <div class="orbit-ring-inner"><div class="dot-inner"></div></div>
            <div class="gibb-text-logo">G.I.B.B.</div>
        </div>
        
        <div class="panel">
            <h2 style="margin-bottom: 15px; letter-spacing: 2px;">LOGIN / INITIALIZE</h2>
            <div id="auth-error" class="error-msg"></div>
            <input type="text" id="username-input" placeholder="Enter Username">
            <select id="gender-input">
                <option value="" disabled selected>Select Title Preference</option>
                <option value="sir">Male (Sir)</option>
                <option value="miss">Female (Miss)</option>
            </select>
            <button class="btn" onclick="initializeProfile()">ESTABLISH CONNECTION</button>
        </div>
    </div>

    <div id="loading-screen" class="screen">
        <div class="logo-container" style="transform: scale(0.8); margin-bottom: 40px;">
            <div class="inner-design-grid"></div>
            <div class="orbit-ring-outer"><div class="dot-outer"></div></div>
            <div class="orbit-ring-inner"><div class="dot-inner"></div></div>
            <div class="gibb-text-logo">G.I.B.B.</div>
        </div>
        
        <h2 id="loading-text" style="margin-bottom: 20px; letter-spacing: 2px; animation: pulseCore 1.5s infinite;">SYSTEM BOOTING...</h2>
        
        <div style="width: 100%; max-width: 400px; height: 6px; background: rgba(0,255,0,0.1); border: 1px solid var(--border-color); border-radius: 3px; margin-bottom: 30px; overflow: hidden;">
            <div id="loading-bar" style="width: 0%; height: 100%; background: var(--accent-color); transition: width 2.5s ease-in-out; box-shadow: 0 0 10px var(--accent-glow);"></div>
        </div>

        <button class="btn" id="init-btn" style="display: none; max-width: 300px; padding: 15px; font-size: 1.1rem; box-shadow: 0 0 20px var(--accent-glow);" onclick="completeInit()">INITIALISE G.I.B.B.</button>
    </div>

    <div id="menu-screen" class="screen">
        <div class="main-menu-layout">
            
            <div class="sidebar-panel">
                <div>
                    <h3 style="margin-bottom: 20px; text-shadow: 0 0 10px var(--accent-glow);">CORE SETTINGS</h3>
                    <div class="widget-box">
                        <div class="widget-title">Access Key Input</div>
                        <input type="text" id="access-key-input" placeholder="Enter key..." style="margin-bottom: 8px; font-size: 0.85rem; padding: 8px;" onkeyup="verifyKey()">
                        <p id="key-status" style="font-size: 0.9rem; font-weight: bold; margin-top: 5px; text-shadow: 0 0 5px rgba(255,0,0,0.5);">🔑 NO KEY</p>
                    </div>
                    
                    <div class="widget-box">
                        <div class="widget-title">System Volume</div>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" onchange="updateVolume()">
                    </div>

                    <div class="widget-box">
                        <div class="widget-title">Remembrance</div>
                        <p style="font-size: 0.85rem; color: #10b981;">✓ Chats remembered permanently.</p>
                    </div>
                </div>
                <div>
                    <button class="btn" style="border-color: var(--danger-color); color: #ff8888; font-size: 0.9rem;" onclick="logout()">LOG OUT</button>
                </div>
            </div>

            <div class="center-menu-panel">
                <div class="logo-container">
                    <div class="inner-design-grid"></div>
                    <div class="orbit-ring-outer"><div class="dot-outer"></div></div>
                    <div class="orbit-ring-inner"><div class="dot-inner"></div></div>
                    <div class="gibb-text-logo">G.I.B.B.</div>
                </div>

                <div class="carousel-container" id="carousel">
                    <button class="carousel-btn big" id="c-btn-0" onclick="selectCarouselOption(0)">Launch Chat</button>
                    <button class="carousel-btn small" id="c-btn-1" onclick="selectCarouselOption(1)">Translation</button>
                </div>
            </div>

            <div class="sidebar-panel">
                <div>
                    <h3 style="margin-bottom: 20px; text-shadow: 0 0 10px var(--accent-glow);">HUD MODULE</h3>
                    <div class="widget-box">
                        <div class="widget-title">Display Metrics</div>
                        <p style="font-size: 1rem;">FPS: <span id="fps-counter" style="font-weight: bold; text-shadow: 0 0 5px var(--accent-color);">60</span></p>
                        <p style="font-size: 1rem; margin-top: 8px;">RES: <span id="res-display" style="font-weight: bold;">1920x1080</span></p>
                    </div>
                </div>
                <div class="widget-box" style="margin-bottom: 0;">
                    <div class="widget-title">Status</div>
                    <p style="font-size: 0.85rem; color: #10b981;">CONNECTED</p>
                </div>
            </div>
        </div>
    </div>

    <div id="dashboard-screen" class="screen">
        <div class="chat-container">
            <div class="chat-header">
                <span style="font-weight: bold; letter-spacing: 2px;">G.I.B.B. NEURAL CONNECT</span>
                <button class="btn" style="width: auto; padding: 8px 16px;" onclick="openMenu()">SYSTEM MENU</button>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message to G.I.B.B...." onkeypress="checkEnter(event)">
                <button class="btn" onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        let carouselIndex = 0;
        let hasSpokenWelcome = false;
        
        let db = JSON.parse(localStorage.getItem('gibb_permanent_db')) || { 
            profile: null,
            chatHistory: [],
            volume: 1.0,
            savedKey: ''
        };

        window.addEventListener('DOMContentLoaded', () => {
            updateResolution();
            window.addEventListener('resize', updateResolution);
            
            document.getElementById('volume-slider').value = db.volume;
            if(db.savedKey) {
                document.getElementById('access-key-input').value = db.savedKey;
            }
            
            // FPS Loop
            let frameCount = 0;
            let lastTime = performance.now();
            function countFPS() {
                frameCount++;
                let currentTime = performance.now();
                if (currentTime - lastTime >= 1000) {
                    const fpsEl = document.getElementById('fps-counter');
                    if(fpsEl) fpsEl.innerText = frameCount;
                    frameCount = 0;
                    lastTime = currentTime;
                }
                requestAnimationFrame(countFPS);
            }
            requestAnimationFrame(countFPS);

            // AUTH / SESSION LOGIC
            // Using sessionStorage so the user stays logged in across reloads, but logs out if the tab is closed.
            if (sessionStorage.getItem('gibb_logged_in') === 'true' && db.profile) {
                showLoadingScreen();
            } else {
                document.getElementById('auth-screen').classList.add('active');
            }
        });

        function updateResolution() {
            const display = document.getElementById('res-display');
            if(display) display.innerText = `${window.innerWidth}x${window.innerHeight}`;
        }

        function verifyKey() {
            const inputVal = document.getElementById('access-key-input').value.trim();
            const statusEl = document.getElementById('key-status');
            
            db.savedKey = inputVal;
            
            if (inputVal.toLowerCase() === 'gibb') {
                statusEl.innerHTML = '🔑 KEY ACTIVE';
                statusEl.style.color = '#10b981';
                statusEl.style.textShadow = '0 0 5px rgba(16, 185, 129, 0.5)';
            } else {
                statusEl.innerHTML = '🔑 NO KEY';
                statusEl.style.color = '#ff4444';
                statusEl.style.textShadow = '0 0 5px rgba(255, 68, 68, 0.5)';
            }
            saveDatabase();
        }

        function updateVolume() {
            db.volume = parseFloat(document.getElementById('volume-slider').value);
            saveDatabase();
        }

        function initializeProfile() {
            const user = document.getElementById('username-input').value.trim();
            const honorific = document.getElementById('gender-input').value;
            const errorBox = document.getElementById('auth-error');

            if (!honorific) {
                errorBox.innerText = "Please select your title preference (Sir or Miss).";
                errorBox.style.display = 'block';
                return;
            }

            db.profile = { name: user || "User", honorific: honorific };
            saveDatabase();
            
            sessionStorage.setItem('gibb_logged_in', 'true');
            showLoadingScreen();
        }

        function showLoadingScreen() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('loading-screen').classList.add('active');
            
            // Reset UI states just in case
            document.getElementById('loading-bar').style.width = '0%';
            document.getElementById('init-btn').style.display = 'none';
            document.getElementById('loading-text').innerText = "SYSTEM BOOTING...";
            document.getElementById('loading-text').style.animation = "pulseCore 1.5s infinite";

            // Trigger Loading Animation
            setTimeout(() => {
                document.getElementById('loading-bar').style.width = '100%';
            }, 100);

            // Show Initialize Button after loading completes
            setTimeout(() => {
                document.getElementById('loading-text').innerText = "SYSTEM READY";
                document.getElementById('loading-text').style.animation = "none";
                document.getElementById('init-btn').style.display = 'block';
            }, 2600);
        }

        function completeInit() {
            speakWelcomeMsg();
            showMenuScreen();
        }

        function speakWelcomeMsg() {
            if (hasSpokenWelcome) return;
            
            const honorific = db.profile && db.profile.honorific === 'sir' ? 'Sir' : 'Miss';
            const text = `Ready when you are, ${honorific}.`;
            const utterance = new SpeechSynthesisUtterance(text);
            
            utterance.volume = db.volume;
            
            // Grab a male voice for G.I.B.B.
            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => 
                v.name.toLowerCase().includes('male') || 
                v.name.toLowerCase().includes('david') || 
                v.name.toLowerCase().includes('mark') || 
                v.name.toLowerCase().includes('guy')
            );
            
            if (maleVoice) utterance.voice = maleVoice;
            
            window.speechSynthesis.speak(utterance);
            hasSpokenWelcome = true;
        }

        // Handle voice list loading async
        window.speechSynthesis.onvoiceschanged = () => {};

        function saveDatabase() {
            localStorage.setItem('gibb_permanent_db', JSON.stringify(db));
        }

        function showMenuScreen() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('menu-screen').classList.add('active');
            verifyKey(); 
        }

        function openMenu() {
            showMenuScreen();
        }

        function selectCarouselOption(index) {
            carouselIndex = index;
            updateCarouselUI();
            if (index === 0) {
                setTimeout(showDashboard, 300);
            }
        }

        function updateCarouselUI() {
            const btn0 = document.getElementById('c-btn-0');
            const btn1 = document.getElementById('c-btn-1');
            if (carouselIndex === 0) {
                btn0.className = "carousel-btn big";
                btn1.className = "carousel-btn small";
            } else {
                btn0.className = "carousel-btn small";
                btn1.className = "carousel-btn big";
            }
        }

        window.addEventListener('wheel', (e) => {
            if (document.getElementById('menu-screen').classList.contains('active')) {
                if (e.deltaY > 0) carouselIndex = 1; else carouselIndex = 0;
                updateCarouselUI();
            }
        });

        function showDashboard() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('dashboard-screen').classList.add('active');
            loadChatHistory();
        }

        function loadChatHistory() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            const history = db.chatHistory || [];
            
            if (history.length === 0) {
                const honorific = db.profile && db.profile.honorific === 'sir' ? 'Sir' : 'Miss';
                appendMessage(`System Core initialized, ${honorific}. Secure channel established.`, 'gibb', false);
            } else {
                history.forEach(msg => {
                    appendMessage(msg.text, msg.sender, false);
                });
            }
        }

        function appendMessage(text, sender, save = true) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            if (save) {
                db.chatHistory.push({ text, sender });
                saveDatabase();
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            setTimeout(() => {
                const honorific = db.profile && db.profile.honorific === 'sir' ? 'Sir' : 'Miss';
                const lowerText = text.toLowerCase();
                let reply = "";

                if (lowerText.includes('who made you') || lowerText.includes('creator') || lowerText.includes('created you')) {
                    reply = `gibbkayyy made me, ${honorific}.`;
                } else {
                    reply = `Acknowledged, ${honorific}. Memory stored.`;
                }
                appendMessage(reply, 'gibb');
            }, 600);
        }

        function logout() {
            // Removes active session without deleting database memory
            sessionStorage.removeItem('gibb_logged_in');
            hasSpokenWelcome = false;
            
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('auth-screen').classList.add('active');
        }
    </script>
</body>
</html>
