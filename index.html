<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.I.B.B. AI Interface</title>
    <style>
        :root {
            --bg-color: #03080c;
            --panel-bg: rgba(5, 12, 20, 0.95);
            --accent-green: #00ff66;
            --text-color: #d1f7ff;
            --border-color: rgba(0, 255, 102, 0.25);
            --danger-color: #ff3366;
            --glow-green: 0 0 12px rgba(0, 255, 102, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.04) 0%, transparent 80%),
                repeating-linear-gradient(transparent 0px, transparent 2px, rgba(0, 255, 102, 0.015) 2px, rgba(0, 255, 102, 0.015) 4px);
            background-size: 100% 100%, 100% 4px;
        }

        .main-wrapper {
            width: 98%;
            max-width: 1100px;
            height: 94vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.12);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* LOGO IMAGE STYLING */
        .gibb-logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--accent-green));
        }

        /* AUTHENTICATION SCREEN */
        #auth-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 8, 12, 0.98);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .auth-card {
            background: var(--panel-bg);
            border: 1px solid var(--accent-green);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.15);
            padding: 35px;
            border-radius: 4px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .auth-card h1 {
            color: var(--accent-green);
            letter-spacing: 4px;
            margin-bottom: 5px;
            font-size: 26px;
        }

        .auth-card p {
            font-size: 12px;
            color: #88a0b0;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--accent-green);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 102, 0.25);
            color: var(--accent-green);
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent-green);
            box-shadow: var(--glow-green);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: var(--glow-green);
        }

        .auth-toggle { margin-top: 15px; font-size: 12px; color: #88a0b0; cursor: pointer; }
        .auth-toggle span { color: var(--accent-green); text-decoration: underline; }

        /* HEADER */
        .header {
            padding: 15px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
        }

        .nav-btn {
            padding: 7px 14px;
            background: transparent;
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: rgba(0, 255, 102, 0.8);
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
        }

        .nav-btn:hover {
            border-color: var(--accent-green);
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
        }

        /* CAROUSEL NAVIGATION */
        .system-carousel {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 15px;
            overflow-x: auto;
        }

        .carousel-item {
            padding: 8px 16px;
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid rgba(0, 255, 102, 0.2);
            color: var(--accent-green);
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .carousel-item:hover { border-color: var(--accent-green); box-shadow: var(--glow-green); }
        .carousel-item.active-item { color: #000; background: var(--accent-green); border-color: var(--accent-green); font-weight: bold; }

        /* VIEW SECTIONS */
        .view-section {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .view-section.active-view {
            display: flex;
        }

        /* CHAT BOX */
        .chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message { max-width: 80%; padding: 12px 18px; border-radius: 4px; line-height: 1.6; font-size: 14px; border: 1px solid transparent; }
        .user-msg { align-self: flex-end; background: rgba(0, 255, 102, 0.08); border-color: rgba(0, 255, 102, 0.2); color: #fff; }
        .bot-msg { align-self: flex-start; background: rgba(0, 0, 0, 0.4); border-color: var(--border-color); color: var(--accent-green); }

        .input-area {
            padding: 18px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
        }

        .input-area input, .input-area select {
            flex: 1;
            padding: 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 102, 0.2);
            color: var(--accent-green);
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        .icon-btn {
            padding: 14px 18px;
            background: rgba(0, 255, 102, 0.08);
            border: 1px solid rgba(0, 255, 102, 0.25);
            color: var(--accent-green);
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .icon-btn:hover { background: rgba(0, 255, 102, 0.15); border-color: var(--accent-green); box-shadow: var(--glow-green); }

        /* TRANSLATION SECTION */
        .translation-panel {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .translation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        .trans-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .trans-box textarea {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            padding: 15px;
            border-radius: 4px;
            resize: none;
            outline: none;
            font-size: 14px;
        }

        /* SETTINGS MODAL */
        .modal { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(3, 8, 12, 0.95); z-index: 50; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--accent-green); padding: 30px; border-radius: 4px; width: 90%; max-width: 500px; box-shadow: var(--glow-green); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: var(--accent-green); letter-spacing: 2px; }
        .close-btn { background: none; border: none; color: var(--danger-color); font-size: 24px; cursor: pointer; }

        .hud-card { display: flex !important; flex-direction: column !important; visibility: visible !important; gap: 15px; }
        .setting-group { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .setting-group label { font-size: 0.8rem; font-weight: bold; color: var(--accent-green); text-transform: uppercase; }
        
        .theme-swatches { display: flex; gap: 10px; margin-top: 5px; }
        .swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; transition: transform 0.2s; }
        .swatch:hover { transform: scale(1.1); }

        .settings-btn { padding: 10px; background: rgba(0, 255, 102, 0.1); border: 1px solid var(--accent-green); color: var(--accent-green); cursor: pointer; border-radius: 4px; font-weight: bold; }
        .settings-btn:hover { background: var(--accent-green); color: #000; }
        
        input[type="range"] { width: 100%; accent-color: var(--accent-green); cursor: pointer; }
    </style>
</head>
<body>

    <div class="main-wrapper">

        <div id="auth-screen">
            <div class="auth-card">
                <img src="gibblogo.png" alt="G.I.B.B. Logo" class="gibb-logo-img" style="width: 70px; height: 70px; margin: 0 auto 15px auto; display: block;" onerror="this.style.display='none'">
                <h1 id="auth-title">G.I.B.B. SYSTEM</h1>
                <p id="auth-sub">INITIALIZE LOGIN CREDENTIALS</p>
                
                <div id="auth-error" style="color: var(--danger-color); font-size: 12px; margin-bottom: 10px; display: none;"></div>

                <div class="input-group" id="name-group" style="display: none;">
                    <label>OPERATOR NAME</label>
                    <input type="text" id="auth-name" placeholder="User">
                </div>

                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" id="auth-email" placeholder="user@domain.com">
                </div>

                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="auth-password" placeholder="••••••••">
                </div>

                <button class="btn" id="auth-btn" onclick="handleAuth()">LOGIN</button>

                <div class="auth-toggle" onclick="toggleAuthMode()">
                    <span id="toggle-text">Need an account? Register Profile</span>
                </div>
            </div>
        </div>

        <div class="header">
            <div class="user-status">
                <img src="gibblogo.png" alt="G.I.B.B." class="gibb-logo-img" onerror="this.style.display='none'">
                <div style="display: flex; flex-direction: column;">
                    <span style="font-weight: bold; letter-spacing: 2px; color: var(--accent-green);">G.I.B.B. INTERFACE</span>
                    <span id="display-user" style="color: rgba(0, 255, 102, 0.7); font-size: 11px;">System Offline</span>
                </div>
            </div>
            <div class="user-status">
                <button class="nav-btn" onclick="openSettings()">⚙️ SETTINGS</button>
                <button class="nav-btn" style="border-color: var(--danger-color); color: var(--danger-color);" onclick="logout()">LOGOUT</button>
            </div>
        </div>

        <div class="system-carousel">
            <div class="carousel-item active-item" onclick="switchView('chat', this)">Main Chat</div>
            <div class="carousel-item" onclick="switchView('translation', this)">Translation Module</div>
            <div class="carousel-item" onclick="openSettings()">System Config</div>
            <div class="carousel-item" onclick="clearCurrentChat()">Clear History</div>
        </div>

        <div class="view-section active-view" id="view-chat">
            <div class="chat-box" id="chat-box">
                <div class="message bot-msg">
                    System initialized. Welcome back.
                </div>
            </div>

            <div class="input-area">
                <button class="icon-btn" onclick="toggleTextVoiceInput()" id="mic-btn">🎙️</button>
                <input type="text" id="user-input" placeholder="Enter message or query..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="icon-btn" onclick="sendMessage()">SEND ➣</button>
            </div>
        </div>

        <div class="view-section" id="view-translation">
            <div class="translation-panel">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="color: var(--accent-green); letter-spacing: 1px;">🌐 LINGUISTIC TRANSLATION PROTOCOL</h3>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <label style="font-size: 12px; color: var(--accent-green);">TARGET LANGUAGE:</label>
                        <select id="target-lang" style="background: rgba(0,0,0,0.6); border: 1px solid var(--accent-green); color: var(--accent-green); padding: 8px; border-radius: 4px; outline: none;">
                            <option value="Spanish">Spanish</option>
                            <option value="French">French</option>
                            <option value="German">German</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Mandarin">Mandarin</option>
                            <option value="Russian">Russian</option>
                        </select>
                    </div>
                </div>
                <div class="translation-grid">
                    <div class="trans-box">
                        <label style="font-size: 11px; color: var(--accent-green);">SOURCE TEXT</label>
                        <textarea id="source-text" placeholder="Type or paste text to translate here..."></textarea>
                    </div>
                    <div class="trans-box">
                        <label style="font-size: 11px; color: var(--accent-green);">TRANSLATED OUTPUT</label>
                        <textarea id="output-text" readonly placeholder="Translation will display here..." style="opacity: 0.8;"></textarea>
                    </div>
                </div>
                <button class="btn" onclick="executeTranslation()">EXECUTE TRANSLATION</button>
            </div>
        </div>

        <div class="modal" id="settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 style="color: var(--accent-green); border-bottom: 1px solid var(--accent-green); padding-bottom: 8px; width: 100%;">⚙️ SYSTEM SETTINGS</h4>
                    <button class="close-btn" onclick="closeSettings()">×</button>
                </div>
                
                <div class="hud-card" style="display: flex !important; flex-direction: column !important; visibility: visible !important;">
                    <div style="background: #000c03; border: 2px solid var(--accent-green); padding: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-size: 0.8rem; font-weight: bold; color: var(--accent-green);">⚡ API Key (Groq Core)</label>
                        <input type="password" id="groq-key-input" placeholder="gsk_..." oninput="saveGroqKey(this.value)" style="width: 100%; background: #010a04; color: var(--accent-green); border: 1px solid var(--accent-green); padding: 10px; border-radius: 4px; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; outline: none;">
                    </div>

                    <div class="setting-group">
                        <label>🎨 HUD Theme / Color</label>
                        <div class="theme-swatches">
                            <div class="swatch" style="background: #00ff66;" onclick="setTheme('#00ff66', 'rgba(0,255,100,0.8)')"></div>
                            <div class="swatch" style="background: #00bfff;" onclick="setTheme('#00bfff', 'rgba(0,191,255,0.8)')"></div>
                            <div class="swatch" style="background: #ffaa00;" onclick="setTheme('#ffaa00', 'rgba(255,170,0,0.8)')"></div>
                            <div class="swatch" style="background: #ff3366;" onclick="setTheme('#ff3366', 'rgba(255,51,102,0.8)')"></div>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label>🔊 Audio Mute Toggle</label>
                        <button class="settings-btn" id="mute-btn" onclick="toggleMute()">MUTE: OFF</button>
                    </div>

                    <div class="setting-group">
                        <label>🎚️ Master Volume: <span id="vol-val">100%</span></label>
                        <input type="range" id="volume-slider" min="0" max="100" value="100" oninput="updateVolume(this.value)">
                    </div>

                    <div class="setting-group">
                        <label>USER EMAIL (READ ONLY)</label>
                        <input type="text" id="profile-email-input" readonly style="opacity: 0.6; color: var(--text-color); background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); padding: 10px; border-radius: 4px;">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let isSignUp = false;
        let currentUser = null;
        let conversationHistory = [];
        let isMuted = false;
        let masterVolume = 1.0;

        window.addEventListener('load', () => {
            const savedSession = localStorage.getItem('gibb_original_session');
            if (savedSession) {
                currentUser = JSON.parse(savedSession);
                initInterface();
            }
        });

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "REGISTER PROFILE" : "G.I.B.B. SYSTEM";
            document.getElementById('auth-sub').innerText = isSignUp ? "NEW OPERATOR REGISTRATION" : "INITIALIZE LOGIN CREDENTIALS";
            document.getElementById('auth-btn').innerText = isSignUp ? "CREATE ACCOUNT" : "LOGIN";
            document.getElementById('name-group').style.display = isSignUp ? "block" : "none";
            document.getElementById('toggle-text').innerText = isSignUp ? "Already have a profile? Login" : "Need an account? Register Profile";
            document.getElementById('auth-error').style.display = "none";
        }

        function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const name = document.getElementById('auth-name').value.trim() || "User";
            const errDiv = document.getElementById('auth-error');

            if (!email || !password) {
                errDiv.innerText = "Error: Email and Password required.";
                errDiv.style.display = "block";
                return;
            }

            let accounts = JSON.parse(localStorage.getItem('gibb_original_accounts')) || {};

            if (isSignUp) {
                if (accounts[email]) {
                    errDiv.innerText = "Error: Account already exists.";
                    errDiv.style.display = "block";
                    return;
                }
                accounts[email] = { name, email, password, groqApiKey: "", history: [] };
                localStorage.setItem('gibb_original_accounts', JSON.stringify(accounts));
                currentUser = accounts[email];
            } else {
                if (!accounts[email] || accounts[email].password !== password) {
                    errDiv.innerText = "Authentication Failure: Check credentials.";
                    errDiv.style.display = "block";
                    return;
                }
                currentUser = accounts[email];
            }

            localStorage.setItem('gibb_original_session', JSON.stringify(currentUser));
            initInterface();
        }

        function initInterface() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('display-user').innerText = `USER: ${currentUser.name.toUpperCase()}`;
            document.getElementById('groq-key-input').value = currentUser.groqApiKey || "";
            document.getElementById('profile-email-input').value = currentUser.email;

            conversationHistory = [
                {
                    role: "system",
                    content: `You are G.I.B.B., an intelligent, direct, and helpful assistant. Address the user as ${currentUser.name}. Keep responses clear, professional, and concise.`
                }
            ];

            if (currentUser.history && currentUser.history.length > 0) {
                currentUser.history.forEach(msg => {
                    conversationHistory.push(msg);
                    if (msg.role !== 'system') {
                        appendMessage(msg.content, msg.role === 'user' ? 'user-msg' : 'bot-msg', false);
                    }
                });
            } else {
                appendMessage(`Welcome back, ${currentUser.name}. How can I assist you today?`, 'bot-msg');
            }

            speakResponse(`Welcome back, ${currentUser.name}.`);
        }

        function logout() {
            saveAccountHistory();
            localStorage.removeItem('gibb_original_session');
            location.reload();
        }

        function switchView(viewName, element) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
            document.querySelectorAll('.carousel-item').forEach(el => el.classList.remove('active-item'));

            if (viewName === 'chat') {
                document.getElementById('view-chat').classList.add('active-view');
            } else if (viewName === 'translation') {
                document.getElementById('view-translation').classList.add('active-view');
            }
            if (element) element.classList.add('active-item');
        }

        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveGroqKey(val) {
            currentUser.groqApiKey = val.trim();
            updateAccountStorage();
        }

        function updateAccountStorage() {
            let accounts = JSON.parse(localStorage.getItem('gibb_original_accounts')) || {};
            if (accounts[currentUser.email]) {
                accounts[currentUser.email].groqApiKey = currentUser.groqApiKey;
                accounts[currentUser.email].history = currentUser.history;
                localStorage.setItem('gibb_original_accounts', JSON.stringify(accounts));
            }
            localStorage.setItem('gibb_original_session', JSON.stringify(currentUser));
        }

        function saveAccountHistory() {
            currentUser.history = conversationHistory.filter(m => m.role !== 'system');
            updateAccountStorage();
        }

        function clearCurrentChat() {
            conversationHistory = [conversationHistory[0]];
            currentUser.history = [];
            updateAccountStorage();
            document.getElementById('chat-box').innerHTML = '<div class="message bot-msg">Memory wiped. Ready for new input.</div>';
        }

        function setTheme(color, glow) {
            document.documentElement.style.setProperty('--accent-green', color);
            document.documentElement.style.setProperty('--glow-green', `0 0 12px ${glow}`);
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mute-btn').innerText = `MUTE: ${isMuted ? 'ON' : 'OFF'}`;
        }

        function updateVolume(val) {
            masterVolume = val / 100;
            document.getElementById('vol-val').innerText = `${val}%`;
        }

        function appendMessage(text, className, save = true) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (save && currentUser) {
                const role = className.includes('user-msg') ? 'user' : 'assistant';
                currentUser.history.push({ role, content: text });
                saveAccountHistory();
            }
            return msgDiv;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user-msg');
            inputField.value = '';

            if (!currentUser.groqApiKey) {
                appendMessage("API key missing. Please check system settings.", 'bot-msg');
                speakResponse("API key missing. Please check system settings.");
                return;
            }

            conversationHistory.push({ role: "user", content: text });
            let loadingDots = appendMessage('...', 'bot-msg', false);

            try {
                let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${currentUser.groqApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                let data = await res.json();
                document.getElementById('chat-box').removeChild(loadingDots);

                if (data.choices && data.choices.length > 0) {
                    let reply = data.choices[0].message.content;
                    conversationHistory.push({ role: "assistant", content: reply });
                    appendMessage(reply, 'bot-msg');
                    speakResponse(reply);
                } else {
                    appendMessage("System Error: Invalid AI response.", 'bot-msg');
                }
            } catch (err) {
                document.getElementById('chat-box').removeChild(loadingDots);
                appendMessage("Connection Error: Unable to reach server cluster.", 'bot-msg');
            }
        }

        async function executeTranslation() {
            const sourceText = document.getElementById('source-text').value.trim();
            const targetLang = document.getElementById('target-lang').value;
            const outputField = document.getElementById('output-text');

            if (!sourceText) {
                outputField.value = "Please enter text to translate.";
                return;
            }

            if (!currentUser.groqApiKey) {
                outputField.value = "Error: Groq API key missing in settings.";
                return;
            }

            outputField.value = "Translating...";

            try {
                let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${currentUser.groqApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: `Translate the following text accurately into ${targetLang}. Return ONLY the translated text without extra explanation.` },
                            { role: "user", content: sourceText }
                        ],
                        temperature: 0.3,
                        max_tokens: 500
                    })
                });

                let data = await res.json();
                if (data.choices && data.choices.length > 0) {
                    outputField.value = data.choices[0].message.content;
                } else {
                    outputField.value = "Translation failed.";
                }
            } catch (err) {
                outputField.value = "Connection error during translation.";
            }
        }

        function speakResponse(text) {
            if (isMuted || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let cleanText = text.replace(/[*#_`]/g, '');
            let utter = new SpeechSynthesisUtterance(cleanText);
            utter.rate = 1.0; 
            utter.pitch = 0.95;
            utter.volume = masterVolume;
            window.speechSynthesis.speak(utter);
        }

        function toggleTextVoiceInput() {
            if (!('webkitSpeechRecognition' in window)) { alert("Speech recognition not supported."); return; }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            const micBtn = document.getElementById('mic-btn');
            micBtn.style.color = '#ff3366';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                micBtn.style.color = 'var(--accent-green)';
                sendMessage();
            };

            recognition.onerror = recognition.onend = () => {
                micBtn.style.color = 'var(--accent-green)';
            };

            recognition.start();
        }
    </script>
</body>
</html>
