<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.I.B.B. Neural Interface</title>
    <link rel="icon" type="image/png" href="gibblogo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --theme-color: #00ff66;
            --theme-glow: rgba(0, 255, 100, 0.8);
            --theme-panel-bg: rgba(2, 15, 7, 0.95);
            --theme-input-bg: #010a04;
        }

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #010a04;
            color: var(--theme-color);
            font-family: 'Orbitron', monospace;
            overflow-x: hidden;
        }

        /* --- Loading Screen --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #010a04;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
            box-sizing: border-box;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .boot-sequence {
            font-size: 0.9rem;
            line-height: 1.8;
            text-shadow: 0 0 10px var(--theme-color);
        }
        .boot-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: var(--theme-color);
            animation: blink 0.8s infinite;
            vertical-align: middle;
            margin-left: 5px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* --- Login Screen --- */
        #login-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            gap: 20px;
        }
        #login-screen img {
            width: 160px;
            filter: drop-shadow(0 0 25px var(--theme-glow));
        }
        .login-box {
            border: 1px solid var(--theme-color);
            padding: 25px;
            border-radius: 12px;
            background: var(--theme-panel-bg);
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
        }
        #login-screen input {
            background-color: var(--theme-input-bg);
            color: var(--theme-color);
            border: 1px solid var(--theme-color);
            padding: 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            text-align: center;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            -webkit-text-security: disc;
        }
        #login-screen button {
            background: #02260f;
            color: var(--theme-color);
            border: 1px solid var(--theme-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            width: 100%;
            transition: 0.2s;
        }
        #login-screen button:hover {
            background-color: var(--theme-color);
            color: #010a04;
        }
        #error-msg { color: #ff3333; display: none; font-size: 0.8rem; }

        /* --- Main Menu Dashboard --- */
        #home-screen {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            padding: 20px;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .hud-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--theme-color);
            padding-bottom: 10px;
            font-size: 0.75rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        .hud-widget {
            background: var(--theme-panel-bg);
            border: 1px solid var(--theme-color);
            padding: 6px 12px;
            border-radius: 6px;
        }

        .dashboard-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }

        @media(min-width: 850px) {
            .dashboard-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                max-width: 1100px;
            }
        }

        .hud-card {
            background: var(--theme-panel-bg);
            border: 2px solid var(--theme-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,255,100,0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }
        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.8rem;
        }
        .setting-group input[type="range"] {
            width: 100%;
            background: var(--theme-input-bg);
            color: var(--theme-color);
            border: 1px solid var(--theme-color);
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }
        .theme-swatches { display: flex; gap: 10px; }
        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .settings-btn {
            background: var(--theme-input-bg);
            color: var(--theme-color);
            border: 1px solid var(--theme-color);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .settings-btn:hover, .settings-btn.active {
            background-color: var(--theme-color);
            color: #010a04;
        }

        /* Center Hub App Switcher Panel */
        .hub-center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
        }
        .hub-center-panel img {
            width: 130px;
            filter: drop-shadow(0 0 20px var(--theme-glow));
        }
        .app-launch-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .app-launch-btn {
            background: var(--theme-panel-bg);
            color: var(--theme-color);
            border: 1px solid var(--theme-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 0 10px rgba(0,255,100,0.1);
            transition: 0.2s;
        }
        .app-launch-btn:hover {
            background: rgba(0, 255, 100, 0.2);
            box-shadow: 0 0 15px var(--theme-glow);
        }

        /* --- App Views (Chat & Translation) --- */
        .app-view {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: #010a04;
            box-sizing: border-box;
        }
        header {
            background: var(--theme-panel-bg);
            padding: 12px 20px;
            border-bottom: 1px solid var(--theme-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: bold;
        }
        header img { height: 28px; }
        .back-home {
            background: transparent;
            border: 1px solid var(--theme-color);
            color: var(--theme-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        /* Chat layout */
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .user-msg {
            background-color: rgba(4, 31, 14, 0.9);
            border: 1px solid var(--theme-color);
            align-self: flex-end;
            color: #ffffff;
        }
        .bot-msg {
            background-color: var(--theme-panel-bg);
            border: 1px solid var(--theme-color);
            align-self: flex-start;
            color: var(--theme-color);
        }

        /* Animated Thinking Dots */
        .thinking-dots span {
            animation: blinkDots 1.4s infinite;
            display: inline-block;
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blinkDots {
            0% { opacity: 0.2; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-4px); }
            100% { opacity: 0.2; transform: translateY(0); }
        }

        .input-area {
            display: flex;
            padding: 12px;
            background: var(--theme-panel-bg);
            border-top: 1px solid var(--theme-color);
            gap: 8px;
        }
        .input-area input {
            flex: 1;
            background-color: var(--theme-input-bg);
            color: var(--theme-color);
            border: 1px solid var(--theme-color);
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
        }
        .input-area button, .voice-btn {
            background: #02260f;
            color: var(--theme-color);
            border: 1px solid var(--theme-color);
            padding: 0 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        /* Translation view */
        .translate-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            justify-content: center;
        }
        .translate-controls { display: flex; gap: 10px; flex-wrap: wrap; }
        .translate-controls select { flex: 1; background: var(--theme-input-bg); color: var(--theme-color); border: 1px solid var(--theme-color); padding: 10px; border-radius: 6px; font-family: inherit; }
        .translate-boxes { display: flex; flex-direction: column; gap: 15px; }
        @media(min-width: 768px) { .translate-boxes { flex-direction: row; } }
        .translate-box { flex: 1; background: var(--theme-panel-bg); border: 1px solid var(--theme-color); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .translate-box textarea { background: var(--theme-input-bg); color: var(--theme-color); border: 1px solid var(--theme-color); border-radius: 4px; padding: 10px; font-family: inherit; resize: none; height: 100px; outline: none; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="boot-sequence" id="boot-text">INITIALIZING KERNEL...<span class="boot-cursor"></span></div>
    </div>

    <div id="login-screen">
        <img src="gibblogo.png" alt="Logo">
        <div class="login-box">
            <h3 style="margin:0; font-size: 0.9rem;">🔒 Enter Authorised Password:</h3>
            <input type="text" id="password-input" placeholder="••••••••">
            <button onclick="checkPassword()">Initialise G.I.B.B.</button>
            <p id="error-msg">Access Denied. Incorrect Security Protocol.</p>
        </div>
    </div>

    <div id="home-screen">
        <div class="hud-top-bar">
            <div class="hud-widget" id="hud-date-time">TIME LOADING...</div>
            <div class="hud-widget" id="key-status-hud">🔑 KEY PENDING</div>
            <div class="hud-widget">CHROMEBOOK MODE ACTIVE</div>
        </div>
        
        <div class="dashboard-grid">
            
            <div class="hud-card" style="display: flex !important; flex-direction: column !important; visibility: visible !important;">
                <h4 style="color: var(--theme-color); border-bottom: 1px solid var(--theme-color); padding-bottom: 8px; margin: 0; font-size: 0.95rem;">⚙️ SYSTEM SETTINGS</h4>
                
                <div style="background: #000c03; border: 2px solid var(--theme-color); padding: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 0.8rem; font-weight: bold; color: var(--theme-color);">⚡ Neural Link API Key (Groq Core)</label>
                    <input type="text" id="groq-key-input" placeholder="gsk_..." oninput="saveGroqKey(this.value)" style="width: 100%; background: #010a04; color: var(--theme-color); border: 1px solid var(--theme-color); padding: 10px; border-radius: 4px; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; outline: none;">
                </div>

                <div class="setting-group">
                    <label>🎨 HUD Theme / Color</label>
                    <div class="theme-swatches">
                        <div class="swatch" style="background: #00ff66;" onclick="setTheme('#00ff66', 'rgba(0,255,100,0.8)')"></div>
                        <div class="swatch" style="background: #00bfff;" onclick="setTheme('#00bfff', 'rgba(0,191,255,0.8)')"></div>
                        <div class="swatch" style="background: #ffaa00;" onclick="setTheme('#ffaa00', 'rgba(255,170,0,0.8)')"></div>
                        <div class="swatch" style="background: #ff3366;" onclick="setTheme('#ff3366', 'rgba(255,51,102,0.8)')"></div>
                    </div>
                </div>

                <div class="setting-group">
                    <label>🔊 Audio Mute Toggle</label>
                    <button class="settings-btn" id="mute-btn" onclick="toggleMute()">MUTE: OFF</button>
                </div>

                <div class="setting-group">
                    <label>🎚️ Master Volume: <span id="vol-val">100%</span></label>
                    <input type="range" id="volume-slider" min="0" max="100" value="100" oninput="updateVolume(this.value)">
                </div>
            </div>

            <div class="hud-card hub-center-panel">
                <img src="gibblogo.png" alt="Logo">
                <div class="app-launch-buttons">
                    <button class="app-launch-btn" onclick="openApp('chat')">💬 Open Terminal Chat</button>
                    <button class="app-launch-btn" onclick="openApp('translate')">🌐 Open Translation Matrix</button>
                </div>
                <div id="live-location-data" style="font-size: 0.75rem; opacity: 0.8; margin-top: 10px;">
                    Node links establishing...
                </div>
            </div>

        </div>
    </div>

    <div class="app-view" id="chat-view">
        <header>
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="gibblogo.png" alt="Logo">
                <span>G.I.B.B. Neural Interface</span>
            </div>
            <button class="back-home" onclick="goHome()">Menu</button>
        </header>
        <div class="chat-container" id="chat-box">
            <div class="message bot-msg">G.I.B.B. core online via Groq AI. Ready, sir.</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask G.I.B.B. anything..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Enter</button>
            <button class="voice-btn" onclick="startListening()">🎙️</button>
        </div>
    </div>

    <div class="app-view" id="translate-view">
        <header>
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="gibblogo.png" alt="Logo">
                <span>G.I.B.B. Translation Engine</span>
            </div>
            <button class="back-home" onclick="goHome()">Menu</button>
        </header>
        <div class="translate-wrapper">
            <div class="translate-controls">
                <select id="target-language">
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="ja">Japanese</option>
                    <option value="zh">Chinese</option>
                </select>
                <button class="settings-btn" onclick="performTranslation()">Execute</button>
            </div>
            <div class="translate-boxes">
                <div class="translate-box">
                    <label>Source Text:</label>
                    <textarea id="source-text" placeholder="Type text..."></textarea>
                </div>
                <div class="translate-box">
                    <label>Translated Output:</label>
                    <textarea id="output-text" readonly placeholder="Output..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PASSWORD = "prki3210";
        let isMuted = false;
        let masterVolume = 1.0;
        let groqApiKey = localStorage.getItem("gibb_groq_key") || "";

        window.addEventListener("load", () => {
            runBootSequence();
            updateHUDClock();
            setInterval(updateHUDClock, 1000);
            fetchLiveWeatherAndLocation();
            
            if(groqApiKey) {
                let keyInput = document.getElementById("groq-key-input");
                if(keyInput) keyInput.value = groqApiKey;
                updateKeyStatusUI(true);
            }
        });

        async function runBootSequence() {
            let steps = ["INITIALIZING KERNEL...", "LOADING MODULES...", "SYSTEM VERIFIED."];
            let bootElem = document.getElementById("boot-text");
            for (let i = 0; i < steps.length; i++) {
                if (bootElem) bootElem.innerHTML = steps[i] + '<span class="boot-cursor"></span>';
                await new Promise(r => setTimeout(r, 200));
            }
            setTimeout(() => {
                let loader = document.getElementById("loading-screen");
                if (loader) {
                    loader.style.opacity = "0";
                    setTimeout(() => {
                        loader.style.display = "none";
                        document.getElementById("login-screen").style.display = "flex";
                    }, 300);
                }
            }, 200);
        }

        async function fetchLiveWeatherAndLocation() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let loc = await res.json();
                document.getElementById("live-location-data").innerHTML = `LOCATION: ${loc.city}, ${loc.country_name}<br>STATUS: Nominal`;
            } catch(e) {
                document.getElementById("live-location-data").innerHTML = `LOCATION: Node Online`;
            }
        }

        function saveGroqKey(val) {
            groqApiKey = val.trim();
            localStorage.setItem("gibb_groq_key", groqApiKey);
            updateKeyStatusUI(groqApiKey.length > 5);
        }

        function updateKeyStatusUI(isActivated) {
            let statusText = isActivated ? "🔑 KEY ACTIVATED" : "🔑 KEY PENDING";
            let hudStatus = document.getElementById("key-status-hud");
            if (hudStatus) hudStatus.innerText = statusText;
        }

        function setTheme(color, glow) {
            document.documentElement.style.setProperty('--theme-color', color);
            document.documentElement.style.setProperty('--theme-glow', glow);
            localStorage.setItem("gibb_theme_color", color);
            localStorage.setItem("gibb_theme_glow", glow);
        }

        function toggleMute() {
            isMuted = !isMuted;
            let btn = document.getElementById("mute-btn");
            btn.innerText = isMuted ? "MUTE: ON" : "MUTE: OFF";
            btn.classList.toggle("active", isMuted);
            localStorage.setItem("gibb_muted", isMuted);
        }

        function updateVolume(val) {
            masterVolume = val / 100;
            document.getElementById("vol-val").innerText = `${val}%`;
            localStorage.setItem("gibb_volume", val);
        }

        function speakJarvis(text) {
            if (!text || isMuted || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.volume = masterVolume;
            window.speechSynthesis.speak(utterance);
        }

        function checkPassword() {
            if (document.getElementById("password-input").value === PASSWORD) {
                document.getElementById("login-screen").style.display = "none";
                let home = document.getElementById("home-screen");
                home.style.display = "flex";
                setTimeout(() => { home.style.opacity = "1"; }, 50);
                speakJarvis("System online.");
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function openApp(name) {
            document.getElementById("home-screen").style.display = "none";
            document.getElementById(name + "-view").style.display = "flex";
        }

        function goHome() {
            window.speechSynthesis?.cancel();
            document.getElementById("chat-view").style.display = "none";
            document.getElementById("translate-view").style.display = "none";
            let home = document.getElementById("home-screen");
            home.style.display = "flex";
            home.style.opacity = "1";
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            let input = document.getElementById("user-input");
            let text = input.value.trim();
            if (!text) return;
            appendMessage(text, 'user-msg');
            input.value = "";
            processGroqAI(text);
        }

        function appendMessage(text, className, isHTML = false) {
            let box = document.getElementById("chat-box");
            let msg = document.createElement("div");
            msg.className = `message ${className}`;
            if (isHTML) msg.innerHTML = text; else msg.innerText = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
            return msg;
        }

        function updateHUDClock() {
            let now = new Date();
            let elem = document.getElementById("hud-date-time");
            if (elem) elem.innerText = `${now.toLocaleDateString()} // ${now.toLocaleTimeString()}`;
        }

        async function processGroqAI(input) {
            if (!groqApiKey) {
                appendMessage("Sir, please enter your Groq API key in the system settings panel.", 'bot-msg');
                speakJarvis("API key missing.");
                return;
            }

            let loadingMsg = appendMessage('<div class="thinking-dots"><span>.</span><span>.</span><span>.</span></div>', 'bot-msg', true);

            try {
                let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${groqApiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "You are G.I.B.B., an advanced AI assistant styled after Jarvis. Address the user as 'sir'." },
                            { role: "user", content: input }
                        ],
                        temperature: 0.7,
                        max_tokens: 400
                    })
                });
                let data = await res.json();
                document.getElementById("chat-box").removeChild(loadingMsg);
                
                if (data.choices && data.choices.length > 0) {
                    let reply = data.choices[0].message.content;
                    appendMessage(reply, 'bot-msg');
                    speakJarvis(reply);
                } else {
                    appendMessage("Neural network error encountered.", 'bot-msg');
                }
            } catch (err) {
                document.getElementById("chat-box").removeChild(loadingMsg);
                appendMessage("Connection to Groq cloud failed.", 'bot-msg');
            }
        }

        async function performTranslation() {
            let text = document.getElementById("source-text").value.trim();
            let lang = document.getElementById("target-language").value;
            let output = document.getElementById("output-text");
            if (!text) return;
            output.value = "Translating...";
            try {
                let res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=autodetect|${lang}`);
                let data = await res.json();
                output.value = data.responseData.translatedText || "Error";
            } catch (e) {
                output.value = "Translation offline.";
            }
        }

        function startListening() {
            let SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) { alert("Speech recognition not supported."); return; }
            let rec = new SpeechRec();
            rec.onresult = (e) => {
                document.getElementById("user-input").value = e.results[0][0].transcript;
                sendMessage();
            };
            rec.start();
        }
    </script>
</body>
</html>
