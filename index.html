<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.I.B.B. AI Interface</title>
    <style>
        :root {
            --bg-color: #03080c;
            --panel-bg: rgba(5, 12, 20, 0.9);
            --accent-green: #00ff88;
            --accent-cyan: #00e1ff;
            --text-color: #d1f7ff;
            --border-color: rgba(0, 225, 255, 0.25);
            --danger-color: #ff3366;
            --glow-green: 0 0 10px rgba(0, 255, 136, 0.4);
            --glow-cyan: 0 0 10px rgba(0, 225, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 225, 255, 0.05) 0%, transparent 80%),
                repeating-linear-gradient(transparent 0px, transparent 2px, rgba(0, 225, 255, 0.02) 2px, rgba(0, 225, 255, 0.02) 4px);
            background-size: 100% 100%, 100% 4px;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            height: 90vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0, 225, 255, 0.15);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* JARVIS REACTOR ANIMATED LOGO */
        .jarvis-logo {
            position: relative;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .jarvis-logo .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top-color: var(--accent-green);
            border-bottom-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: var(--glow-green);
            animation: rotateClockwise 3s linear infinite;
        }

        .jarvis-logo .ring-inner {
            position: absolute;
            width: 60%;
            height: 60%;
            border: 2px solid transparent;
            border-left-color: rgba(0, 225, 255, 0.4);
            border-right-color: rgba(0, 225, 255, 0.4);
            border-radius: 50%;
            animation: rotateAntiClockwise 1.5s linear infinite;
        }

        .jarvis-logo .dot-center {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        @keyframes rotateClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotateAntiClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        /* AUTHENTICATION SCREEN */
        #auth-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 8, 12, 0.98);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .auth-card {
            background: var(--panel-bg);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0, 225, 255, 0.2);
            padding: 35px;
            border-radius: 4px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h1 {
            color: var(--accent-cyan);
            letter-spacing: 3px;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .auth-card p {
            font-size: 12px;
            color: #88a0b0;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--accent-cyan);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }

        .input-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: rgba(0, 225, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-weight: bold;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: var(--glow-cyan);
        }

        .auth-toggle {
            margin-top: 15px;
            font-size: 12px;
            color: #88a0b0;
            cursor: pointer;
        }

        .auth-toggle span {
            color: var(--accent-cyan);
            text-decoration: underline;
        }

        /* MAIN HUD INTERFACE */
        .header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-cyan);
            letter-spacing: 2px;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }

        .nav-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid rgba(0, 225, 255, 0.3);
            color: rgba(0, 225, 255, 0.8);
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
        }

        .nav-btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 225, 255, 0.1);
            color: var(--accent-cyan);
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 4px;
            line-height: 1.5;
            font-size: 14px;
            border: 1px solid transparent;
        }

        .user-msg {
            align-self: flex-end;
            background: rgba(0, 225, 255, 0.05);
            border-color: rgba(0, 225, 255, 0.2);
            color: #fff;
        }

        .bot-msg {
            align-self: flex-start;
            background: rgba(0, 255, 136, 0.04);
            border-color: rgba(0, 255, 136, 0.2);
            color: var(--accent-green);
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        .icon-btn {
            padding: 12px 16px;
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.2);
            color: var(--accent-green);
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--accent-green);
            box-shadow: var(--glow-green);
        }

        /* SETTINGS MODAL */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 8, 12, 0.95);
            z-index: 50;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--accent-cyan);
            padding: 25px;
            border-radius: 4px;
            width: 90%;
            max-width: 480px;
            box-shadow: var(--glow-cyan);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 20px;
            cursor: pointer;
        }

        .thinking-dots span {
            animation: blink 1.4s infinite;
            font-weight: bold;
            font-size: 18px;
        }
        .thinking-dots span:nth-child(2) { animation-delay: .2s; }
        .thinking-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1 id="auth-title">G.I.B.B. LOGIN</h1>
            <p id="auth-sub">SIGN IN TO YOUR ACCOUNT</p>
            
            <div id="auth-error" style="color: var(--danger-color); font-size: 12px; margin-bottom: 10px; display: none;"></div>

            <div class="input-group" id="name-group" style="display: none;">
                <label>YOUR NAME</label>
                <input type="text" id="auth-name" placeholder="User">
            </div>

            <div class="input-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="auth-email" placeholder="user@domain.com">
            </div>

            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="auth-password" placeholder="••••••••">
            </div>

            <button class="btn" id="auth-btn" onclick="handleAuth()">LOGIN</button>

            <div class="auth-toggle" onclick="toggleAuthMode()">
                <span id="toggle-text">Need an account? Sign Up</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div class="jarvis-logo">
                    <div class="ring-outer"></div>
                    <div class="ring-inner"></div>
                    <div class="dot-center"></div>
                </div>
                <div class="logo-text">G.I.B.B. OS</div>
            </div>
            <div class="user-status">
                <span id="display-user">USER: OFFLINE</span>
                <button class="nav-btn" onclick="openSettings()">⚙️ SETTINGS</button>
                <button class="nav-btn" style="border-color: var(--danger-color); color: var(--danger-color);" onclick="logout()">LOGOUT</button>
            </div>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message bot-msg">
                System online. Welcome back.
            </div>
        </div>

        <div class="input-area">
            <button class="icon-btn" onclick="toggleVoice()" id="mic-btn">🎙️</button>
            <input type="text" id="user-input" placeholder="Enter message or ask something..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="icon-btn" onclick="sendMessage()">SEND ➢</button>
        </div>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>SYSTEM SETTINGS</h3>
                <button class="close-btn" onclick="closeSettings()">&times;</button>
            </div>
            
            <div class="input-group">
                <label>GROQ API KEY</label>
                <input type="password" id="groq-key-input" placeholder="gsk_...">
            </div>

            <div class="input-group">
                <label>USER EMAIL</label>
                <input type="text" id="profile-email-input" readonly style="opacity: 0.6; color: var(--text-color);">
            </div>

            <button class="btn" onclick="saveSettings()">SAVE SETTINGS</button>
        </div>
    </div>

    <script>
        let isSignUp = false;
        let currentUser = null;
        let conversationHistory = [];

        // Load active session on start
        window.addEventListener('load', () => {
            const savedSession = localStorage.getItem('gibb_current_user');
            if (savedSession) {
                currentUser = JSON.parse(savedSession);
                initInterface();
            }
        });

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "CREATE ACCOUNT" : "G.I.B.B. LOGIN";
            document.getElementById('auth-sub').innerText = isSignUp ? "REGISTER A NEW PROFILE" : "SIGN IN TO YOUR ACCOUNT";
            document.getElementById('auth-btn').innerText = isSignUp ? "CREATE ACCOUNT" : "LOGIN";
            document.getElementById('name-group').style.display = isSignUp ? "block" : "none";
            document.getElementById('toggle-text').innerText = isSignUp ? "Already have an account? Login" : "Need an account? Sign Up";
            document.getElementById('auth-error').style.display = "none";
        }

        function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const name = document.getElementById('auth-name').value.trim() || "User";
            const errDiv = document.getElementById('auth-error');

            if (!email || !password) {
                errDiv.innerText = "Please enter both Email and Password.";
                errDiv.style.display = "block";
                return;
            }

            let accounts = JSON.parse(localStorage.getItem('gibb_accounts')) || {};

            if (isSignUp) {
                if (accounts[email]) {
                    errDiv.innerText = "An account with this email already exists.";
                    errDiv.style.display = "block";
                    return;
                }
                accounts[email] = { name, email, password, groqApiKey: "" };
                localStorage.setItem('gibb_accounts', JSON.stringify(accounts));
                currentUser = accounts[email];
            } else {
                if (!accounts[email] || accounts[email].password !== password) {
                    errDiv.innerText = "Invalid credentials. Check your email and password.";
                    errDiv.style.display = "block";
                    return;
                }
                currentUser = accounts[email];
            }

            localStorage.setItem('gibb_current_user', JSON.stringify(currentUser));
            initInterface();
        }

        function initInterface() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('display-user').innerText = `USER: ${currentUser.name.toUpperCase()} (${currentUser.email})`;
            document.getElementById('groq-key-input').value = currentUser.groqApiKey || "";
            document.getElementById('profile-email-input').value = currentUser.email;

            // System prompt
            conversationHistory = [
                {
                    role: "system",
                    content: `You are G.I.B.B., a smart, helpful AI assistant. Address the user as ${currentUser.name}. Keep your responses direct, clear, intelligent, and concise.`
                }
            ];

            appendMessage(`Welcome back, ${currentUser.name}. How can I help you today?`, 'bot-msg');
        }

        function logout() {
            localStorage.removeItem('gibb_current_user');
            location.reload();
        }

        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveSettings() {
            const key = document.getElementById('groq-key-input').value.trim();
            currentUser.groqApiKey = key;

            let accounts = JSON.parse(localStorage.getItem('gibb_accounts')) || {};
            if (accounts[currentUser.email]) {
                accounts[currentUser.email].groqApiKey = key;
                localStorage.setItem('gibb_accounts', JSON.stringify(accounts));
            }
            localStorage.setItem('gibb_current_user', JSON.stringify(currentUser));

            closeSettings();
            appendMessage("Settings saved successfully. Groq API Key updated.", 'bot-msg');
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user-msg');
            inputField.value = '';

            if (!currentUser.groqApiKey) {
                appendMessage("Please open ⚙️ SETTINGS and save your Groq API key to start chatting.", 'bot-msg');
                speak("API key missing. Please enter your Groq API key in system settings.");
                return;
            }

            conversationHistory.push({ role: "user", content: text });
            let loadingDots = appendMessage('<div class="thinking-dots"><span>.</span><span>.</span><span>.</span></div>', 'bot-msg');

            try {
                let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${currentUser.groqApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                let data = await res.json();
                document.getElementById('chat-box').removeChild(loadingDots);

                if (data.choices && data.choices.length > 0) {
                    let reply = data.choices[0].message.content;
                    conversationHistory.push({ role: "assistant", content: reply });
                    appendMessage(reply, 'bot-msg');
                    speak(reply);
                } else {
                    appendMessage("Error: AI returned invalid response format.", 'bot-msg');
                }
            } catch (err) {
                document.getElementById('chat-box').removeChild(loadingDots);
                appendMessage("Connection error: Unable to reach Groq server.", 'bot-msg');
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let cleanText = text.replace(/[*#_`]/g, '');
                let utter = new SpeechSynthesisUtterance(cleanText);
                utter.rate = 1.0;
                utter.pitch = 0.9;
                window.speechSynthesis.speak(utter);
            }
        }

        function toggleVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Speech recognition is not supported on this browser.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            const micBtn = document.getElementById('mic-btn');
            micBtn.style.color = '#ff3366';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                micBtn.style.color = 'var(--accent-green)';
                sendMessage();
            };

            recognition.onerror = recognition.onend = () => {
                micBtn.style.color = 'var(--accent-green)';
            };

            recognition.start();
        }
    </script>
</body>
</html>
