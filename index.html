<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.I.B.B. System - Secure Core</title>
    <style>
        :root {
            --bg-color: #030803;
            --panel-bg: rgba(0, 20, 0, 0.85);
            --border-color: rgba(0, 255, 0, 0.45);
            --text-color: #00ff00;
            --accent-color: #00ff00;
            --accent-glow: rgba(0, 255, 0, 0.6);
            --danger-color: #ff4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated Tech Grid Background */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 25s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-40px, -40px); }
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* Logo Design */
        .logo-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .gibb-text-logo {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            z-index: 10;
            text-shadow: 0 0 20px var(--accent-glow);
            letter-spacing: 4px;
            transform: translateX(6px); 
            text-align: center;
            position: absolute;
        }

        .inner-design-grid {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px dotted rgba(0, 255, 0, 0.3);
            background: radial-gradient(circle, rgba(0,255,0,0.08) 0%, transparent 70%);
            animation: pulseCore 4s ease-in-out infinite;
        }

        @keyframes pulseCore {
            0%, 100% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .orbit-ring-outer {
            position: absolute; width: 240px; height: 240px; border-radius: 50%;
            border: 2px solid rgba(0, 255, 0, 0.6); animation: spinClockwise 12s linear infinite;
        }
        .dot-outer {
            position: absolute; width: 10px; height: 10px; background-color: var(--accent-color);
            border-radius: 50%; box-shadow: 0 0 10px var(--accent-color); top: -5px; left: calc(50% - 5px);
        }

        .orbit-ring-inner {
            position: absolute; width: 190px; height: 190px; border-radius: 50%;
            border: 1px dashed rgba(0, 255, 0, 0.4); animation: spinCounterClockwise 8s linear infinite;
        }
        .dot-inner {
            position: absolute; width: 6px; height: 6px; background-color: rgba(0, 255, 0, 0.8);
            border-radius: 50%; bottom: -3px; left: calc(50% - 3px);
        }

        @keyframes spinClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinCounterClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        /* Panels & Forms */
        .panel {
            background: var(--panel-bg); border: 2px solid var(--border-color);
            padding: 30px; border-radius: 12px; width: 100%; max-width: 420px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.15); text-align: center; backdrop-filter: blur(10px);
        }

        input, select, textarea {
            width: 100%; padding: 12px 16px; margin-bottom: 15px;
            background: rgba(0, 255, 0, 0.08); border: 1px solid var(--border-color);
            border-radius: 4px; color: var(--text-color); font-size: 1rem; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }
        select option { background: var(--bg-color); color: var(--text-color); }

        input[type="range"] {
            -webkit-appearance: none; width: 100%; background: rgba(0, 255, 0, 0.1);
            height: 6px; border-radius: 3px; outline: none; border: 1px solid var(--border-color); margin: 10px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: var(--accent-color); cursor: pointer; box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn {
            width: 100%; padding: 12px; background: rgba(0, 255, 0, 0.2);
            color: var(--accent-color); border: 2px solid var(--border-color);
            border-radius: 4px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s; margin-bottom: 10px;
        }
        .btn:hover { background: rgba(0, 255, 0, 0.4); box-shadow: 0 0 15px var(--accent-glow); }

        .error-msg { color: var(--danger-color); font-size: 0.85rem; margin-bottom: 15px; display: none; }

        /* Main Menu Layout */
        .main-menu-layout {
            display: grid; grid-template-columns: 320px 1fr 320px;
            width: 100vw; height: 100vh; padding: 30px; gap: 30px; align-items: center;
        }

        /* HOLOGRAPHIC SIDEBARS */
        .sidebar-panel {
            background: linear-gradient(135deg, rgba(0,255,0,0.05) 0%, rgba(0,15,0,0.85) 100%);
            border: 1px solid rgba(0, 255, 0, 0.5);
            border-radius: 12px; padding: 25px; height: 100%; display: flex;
            flex-direction: column; justify-content: space-between; 
            backdrop-filter: blur(15px);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.15), inset 0 0 20px rgba(0, 255, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Holographic Scanline Effect */
        .sidebar-panel::after {
            content: ""; position: absolute; top: -100%; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, transparent, rgba(0,255,0,0.15), transparent);
            animation: scanline 6s linear infinite; pointer-events: none; opacity: 0.5;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(400%); }
        }

        .widget-box {
            background: rgba(0, 255, 0, 0.05); border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 8px; padding: 15px; margin-bottom: 15px;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.05);
        }
        .widget-title {
            font-size: 0.85rem; color: #88ff88; text-transform: uppercase;
            margin-bottom: 8px; letter-spacing: 1px; font-weight: bold;
        }

        .center-menu-panel {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%;
        }

        .carousel-container {
            display: flex; align-items: center; justify-content: center;
            gap: 15px; height: 120px; margin-top: 10px; width: 100%;
        }

        .carousel-btn {
            background: rgba(0, 20, 0, 0.8); border: 2px solid var(--border-color);
            color: var(--accent-color); padding: 15px 20px; border-radius: 4px;
            cursor: pointer; transition: all 0.4s ease; font-weight: bold;
        }
        .carousel-btn.small { transform: scale(0.8); opacity: 0.4; font-size: 0.8rem; }
        .carousel-btn.big { transform: scale(1.1); opacity: 1; font-size: 1.1rem; border-color: var(--accent-color); box-shadow: 0 0 20px var(--accent-glow); }

        /* Chat Interface */
        .chat-container {
            width: 100%; height: 100%; display: flex; flex-direction: column; background: transparent; overflow: hidden;
        }
        .chat-header {
            padding: 20px 30px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px);
        }
        .chat-messages {
            flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
            background: rgba(0, 10, 0, 0.7); backdrop-filter: blur(5px);
        }
        .message { max-width: 75%; padding: 14px 18px; border-radius: 8px; font-size: 1rem; line-height: 1.5; }
        .message.user { background: var(--accent-color); color: #000000; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: bold; }
        .message.gibb { background: rgba(0, 255, 0, 0.05); color: var(--text-color); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--border-color); box-shadow: 0 0 10px rgba(0,255,0,0.1); }
        .chat-input-area {
            display: flex; padding: 20px 30px; border-top: 1px solid var(--border-color); background: var(--panel-bg); gap: 15px; backdrop-filter: blur(10px);
        }
        
        /* Voice Active Overlay */
        .voice-status-text {
            margin-top: 40px; font-size: 1.5rem; letter-spacing: 2px; color: var(--accent-color);
            text-shadow: 0 0 15px var(--accent-glow); animation: pulseText 2s infinite;
        }
        @keyframes pulseText { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    </style>
</head>
<body>

    <div id="auth-screen" class="screen">
        <div class="logo-container">
            <div class="inner-design-grid"></div>
            <div class="orbit-ring-outer"><div class="dot-outer"></div></div>
            <div class="orbit-ring-inner"><div class="dot-inner"></div></div>
            <div class="gibb-text-logo">G.I.B.B.</div>
        </div>
        
        <div class="panel" id="auth-panel">
            </div>
    </div>

    <div id="loading-screen" class="screen">
        <div class="logo-container" style="transform: scale(0.8); margin-bottom: 40px;">
            <div class="inner-design-grid"></div>
            <div class="orbit-ring-outer"><div class="dot-outer"></div></div>
            <div class="orbit-ring-inner"><div class="dot-inner"></div></div>
            <div class="gibb-text-logo">G.I.B.B.</div>
        </div>
        
        <h2 id="loading-text" style="margin-bottom: 20px; letter-spacing: 2px; animation: pulseCore 1.5s infinite;">SYSTEM BOOTING...</h2>
        
        <div style="width: 100%; max-width: 400px; height: 6px; background: rgba(0,255,0,0.1); border: 1px solid var(--border-color); border-radius: 3px; margin-bottom: 30px; overflow: hidden;">
            <div id="loading-bar" style="width: 0%; height: 100%; background: var(--accent-color); transition: width 2.5s ease-in-out; box-shadow: 0 0 10px var(--accent-glow);"></div>
        </div>

        <button class="btn" id="init-btn" style="display: none; max-width: 300px; padding: 15px; font-size: 1.1rem; box-shadow: 0 0 20px var(--accent-glow);" onclick="completeInit()">INITIALISE G.I.B.B.</button>
    </div>

    <div id="menu-screen" class="screen">
        <div class="main-menu-layout">
            
            <div class="sidebar-panel">
                <div>
                    <h3 style="margin-bottom: 20px; text-shadow: 0 0 10px var(--accent-glow);">CORE SETTINGS</h3>
                    <div class="widget-box">
                        <div class="widget-title">Access Key Input</div>
                        <input type="text" id="access-key-input" placeholder="Enter key..." style="margin-bottom: 8px; font-size: 0.85rem; padding: 8px;" onkeyup="verifyKey()">
                        <p id="key-status" style="font-size: 0.9rem; font-weight: bold; margin-top: 5px; text-shadow: 0 0 5px rgba(255,0,0,0.5);">🔑 NO KEY</p>
                    </div>
                    
                    <div class="widget-box">
                        <div class="widget-title">System Volume</div>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" onchange="updateVolume()">
                    </div>
                </div>
                <div>
                    <button class="btn" style="border-color: var(--danger-color); color: #ff8888; font-size: 0.9rem;" onclick="logout()">LOG OUT</button>
                </div>
            </div>

            <div class="center-menu-panel">
                <div class="logo-container">
                    <div class="inner-design-grid"></div>
                    <div class="orbit-ring-outer"><div class="dot-outer"></div></div>
                    <div class="orbit-ring-inner"><div class="dot-inner"></div></div>
                    <div class="gibb-text-logo">G.I.B.B.</div>
                </div>

                <div class="carousel-container" id="carousel">
                    <button class="carousel-btn small" id="c-btn-0" onclick="selectCarouselOption(0)">Launch Chat</button>
                    <button class="carousel-btn small" id="c-btn-1" onclick="selectCarouselOption(1)">Voice Control</button>
                    <button class="carousel-btn big" id="c-btn-2" onclick="selectCarouselOption(2)">Translation</button>
                </div>
            </div>

            <div class="sidebar-panel">
                <div>
                    <h3 style="margin-bottom: 20px; text-shadow: 0 0 10px var(--accent-glow);">HUD MODULE</h3>
                    <div class="widget-box">
                        <div class="widget-title">Display Metrics</div>
                        <p style="font-size: 1rem;">FPS: <span id="fps-counter" style="font-weight: bold; text-shadow: 0 0 5px var(--accent-color);">60</span></p>
                        <p style="font-size: 1rem; margin-top: 8px;">RES: <span id="res-display" style="font-weight: bold;">1920x1080</span></p>
                    </div>
                </div>
                <div class="widget-box" style="margin-bottom: 0;">
                    <div class="widget-title">Status</div>
                    <p style="font-size: 0.85rem; color: #10b981;">CONNECTED</p>
                </div>
            </div>
        </div>
    </div>

    <div id="voice-screen" class="screen">
        <div class="logo-container" style="transform: scale(1.2);">
            <div class="inner-design-grid"></div>
            <div class="orbit-ring-outer" style="border-color: #00ff00; box-shadow: 0 0 20px #00ff00;"><div class="dot-outer"></div></div>
            <div class="orbit-ring-inner"><div class="dot-inner"></div></div>
            <div class="gibb-text-logo">G.I.B.B.</div>
        </div>
        <div class="voice-status-text">LISTENING...</div>
        <div id="voice-transcript" style="margin-top: 20px; font-style: italic; color: #88ff88; max-width: 600px; text-align: center; height: 30px;"></div>
        
        <button class="btn" style="position: absolute; bottom: 40px; width: auto; padding: 10px 30px;" onclick="deactivateVoiceControl()">SYSTEM MENU</button>
    </div>

    <div id="dashboard-screen" class="screen">
        <div class="chat-container">
            <div class="chat-header">
                <span style="font-weight: bold; letter-spacing: 2px;">G.I.B.B. NEURAL CONNECT</span>
                <button class="btn" style="width: auto; padding: 8px 16px; margin-bottom: 0;" onclick="openMenu()">SYSTEM MENU</button>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message to G.I.B.B...." onkeypress="checkEnter(event)">
                <button class="btn" style="width: 120px; margin-bottom: 0;" onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </div>

    <div id="translation-screen" class="screen">
        <div class="chat-container">
            <div class="chat-header">
                <span style="font-weight: bold; letter-spacing: 2px;">G.I.B.B. 50-LANGUAGE TRANSLATOR</span>
                <button class="btn" style="width: auto; padding: 8px 16px; margin-bottom: 0;" onclick="openMenu()">SYSTEM MENU</button>
            </div>
            <div style="flex: 1; padding: 30px; display: flex; flex-direction: column; gap: 20px; background: rgba(0, 10, 0, 0.7); backdrop-filter: blur(5px); overflow-y: auto;">
                <div style="display: flex; gap: 20px;">
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #88ff88;">ENGLISH SOURCE TEXT</label>
                        <textarea id="source-text" rows="5" placeholder="Type English text to translate..." oninput="executeTranslation()"></textarea>
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #88ff88;">TARGET LANGUAGE</label>
                        <select id="target-lang-select" onchange="executeTranslation()">
                            </select>
                    </div>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #88ff88;">TRANSLATED OUTPUT</label>
                    <div id="translation-output" style="padding: 15px; background: rgba(0,255,0,0.05); border: 1px solid var(--border-color); border-radius: 4px; min-height: 100px; color: var(--text-color); word-break: break-word;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let carouselIndex = 2; // Default to Translation in center
        let hasSpokenWelcome = false;
        
        // Voice Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isVoiceActive = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            
            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                
                const display = document.getElementById('voice-transcript');
                display.innerText = finalTranscript || interimTranscript;

                if (finalTranscript) {
                    processVoiceCommand(finalTranscript.toLowerCase());
                }
            };

            recognition.onend = () => {
                if (isVoiceActive) {
                    setTimeout(() => { if(isVoiceActive) recognition.start(); }, 500);
                }
            };
        }

        // 50 Languages Dictionary mapping
        const languages50 = [
            { code: 'es', name: 'Spanish' },
            { code: 'fr', name: 'French' },
            { code: 'de', name: 'German' },
            { code: 'it', name: 'Italian' },
            { code: 'pt', name: 'Portuguese' },
            { code: 'ru', name: 'Russian' },
            { code: 'ja', name: 'Japanese' },
            { code: 'ko', name: 'Korean' },
            { code: 'zh', name: 'Chinese (Mandarin)' },
            { code: 'ar', name: 'Arabic' },
            { code: 'hi', name: 'Hindi' },
            { code: 'nl', name: 'Dutch' },
            { code: 'pl', name: 'Polish' },
            { code: 'tr', name: 'Turkish' },
            { code: 'vi', name: 'Vietnamese' },
            { code: 'th', name: 'Thai' },
            { code: 'sv', name: 'Swedish' },
            { code: 'no', name: 'Norwegian' },
            { code: 'da', name: 'Danish' },
            { code: 'fi', name: 'Finnish' },
            { code: 'el', name: 'Greek' },
            { code: 'cs', name: 'Czech' },
            { code: 'hu', name: 'Hungarian' },
            { code: 'ro', name: 'Romanian' },
            { code: 'uk', name: 'Ukrainian' },
            { code: 'id', name: 'Indonesian' },
            { code: 'ms', name: 'Malay' },
            { code: 'he', name: 'Hebrew' },
            { code: 'fa', name: 'Persian' },
            { code: 'hi', name: 'Hindi' },
            { code: 'bn', name: 'Bengali' },
            { code: 'ur', name: 'Urdu' },
            { code: 'ta', name: 'Tamil' },
            { code: 'te', name: 'Telugu' },
            { code: 'mr', name: 'Marathi' },
            { code: 'gu', name: 'Gujarati' },
            { code: 'kn', name: 'Kannada' },
            { code: 'ml', name: 'Malayalam' },
            { code: 'pa', name: 'Punjabi' },
            { code: 'sw', name: 'Swahili' },
            { code: 'fil', name: 'Filipino' },
            { code: 'vi', name: 'Vietnamese' },
            { code: 'hu', name: 'Hungarian' },
            { code: 'bg', name: 'Bulgarian' },
            { code: 'hr', name: 'Croatian' },
            { code: 'sr', name: 'Serbian' },
            { code: 'sk', name: 'Slovak' },
            { code: 'sl', name: 'Slovenian' },
            { code: 'et', name: 'Estonian' },
            { code: 'lv', name: 'Latvian' },
            { code: 'lt', name: 'Lithuanian' }
        ];
        
        let db = JSON.parse(localStorage.getItem('gibb_permanent_db')) || { 
            profile: null, chatHistory: [], volume: 1.0, savedKey: ''
        };

        window.addEventListener('DOMContentLoaded', () => {
            updateResolution();
            window.addEventListener('resize', updateResolution);
            
            document.getElementById('volume-slider').value = db.volume;
            if(db.savedKey) document.getElementById('access-key-input').value = db.savedKey;
            
            // Populate 50 Languages select dropdown
            const langSelect = document.getElementById('target-lang-select');
            langSelect.innerHTML = '';
            languages50.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l.code;
                opt.innerText = l.name;
                langSelect.appendChild(opt);
            });

            // FPS Loop
            let frameCount = 0; let lastTime = performance.now();
            function countFPS() {
                frameCount++; let currentTime = performance.now();
                if (currentTime - lastTime >= 1000) {
                    const fpsEl = document.getElementById('fps-counter');
                    if(fpsEl) fpsEl.innerText = frameCount;
                    frameCount = 0; lastTime = currentTime;
                }
                requestAnimationFrame(countFPS);
            }
            requestAnimationFrame(countFPS);

            // AUTH / SESSION LOGIC
            if (sessionStorage.getItem('gibb_logged_in') === 'true' && db.profile) {
                showLoadingScreen();
            } else {
                renderAuthScreen();
                switchScreen('auth-screen');
            }
        });

        function renderAuthScreen() {
            const panel = document.getElementById('auth-panel');
            if (db.profile && db.profile.name) {
                panel.innerHTML = `
                    <h2 style="margin-bottom: 15px; letter-spacing: 2px;">WELCOME BACK</h2>
                    <p style="margin-bottom: 25px; color: #88ff88;">USER: ${db.profile.name.toUpperCase()}</p>
                    <button class="btn" onclick="quickLogin()">LOGIN</button>
                    <button class="btn" style="background: transparent; border-color: rgba(0,255,0,0.2); font-size: 0.8rem;" onclick="clearProfileData()">CREATE NEW ACCOUNT</button>
                `;
            } else {
                panel.innerHTML = `
                    <h2 style="margin-bottom: 15px; letter-spacing: 2px;">INITIALIZE PROFILE</h2>
                    <div id="auth-error" class="error-msg"></div>
                    <input type="text" id="username-input" placeholder="Enter Username">
                    <select id="gender-input">
                        <option value="" disabled selected>Select Title Preference</option>
                        <option value="sir">Male (Sir)</option>
                        <option value="miss">Female (Miss)</option>
                    </select>
                    <button class="btn" onclick="initializeProfile()">ESTABLISH CONNECTION</button>
                `;
            }
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function updateResolution() {
            const display = document.getElementById('res-display');
            if(display) display.innerText = `${window.innerWidth}x${window.innerHeight}`;
        }

        function verifyKey() {
            const inputVal = document.getElementById('access-key-input').value.trim();
            const statusEl = document.getElementById('key-status');
            db.savedKey = inputVal;
            
            if (inputVal.toLowerCase() === 'gibb') {
                statusEl.innerHTML = '🔑 KEY ACTIVE';
                statusEl.style.color = '#10b981';
                statusEl.style.textShadow = '0 0 5px rgba(16, 185, 129, 0.5)';
            } else {
                statusEl.innerHTML = '🔑 NO KEY';
                statusEl.style.color = '#ff4444';
                statusEl.style.textShadow = '0 0 5px rgba(255, 68, 68, 0.5)';
            }
            saveDatabase();
        }

        function updateVolume() { db.volume = parseFloat(document.getElementById('volume-slider').value); saveDatabase(); }

        function quickLogin() {
            sessionStorage.setItem('gibb_logged_in', 'true');
            showLoadingScreen();
        }

        function initializeProfile() {
            const user = document.getElementById('username-input').value.trim();
            const honorific = document.getElementById('gender-input').value;
            const errorBox = document.getElementById('auth-error');

            if (!honorific) {
                errorBox.innerText = "Please select your title preference (Sir or Miss).";
                errorBox.style.display = 'block';
                return;
            }

            db.profile = { name: user || "User", honorific: honorific };
            saveDatabase();
            sessionStorage.setItem('gibb_logged_in', 'true');
            showLoadingScreen();
        }

        function showLoadingScreen() {
            switchScreen('loading-screen');
            document.getElementById('loading-bar').style.width = '0%';
            document.getElementById('init-btn').style.display = 'none';
            document.getElementById('loading-text').innerText = "SYSTEM BOOTING...";
            document.getElementById('loading-text').style.animation = "pulseCore 1.5s infinite";

            setTimeout(() => { document.getElementById('loading-bar').style.width = '100%'; }, 100);
            setTimeout(() => {
                document.getElementById('loading-text').innerText = "SYSTEM READY";
                document.getElementById('loading-text').style.animation = "none";
                document.getElementById('init-btn').style.display = 'block';
            }, 2600);
        }

        function completeInit() { speakWelcomeMsg(); showMenuScreen(); }

        function speak(text, callback) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.volume = db.volume;
            
            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('mark') || v.name.toLowerCase().includes('guy'));
            if (maleVoice) utterance.voice = maleVoice;
            
            if (callback) utterance.onend = callback;
            window.speechSynthesis.speak(utterance);
        }

        function speakWelcomeMsg() {
            if (hasSpokenWelcome) return;
            const honorific = db.profile.honorific === 'sir' ? 'Sir' : 'Miss';
            speak(`Ready when you are, ${honorific}.`);
            hasSpokenWelcome = true;
        }

        window.speechSynthesis.onvoiceschanged = () => {};

        function saveDatabase() { localStorage.setItem('gibb_permanent_db', JSON.stringify(db)); }

        function showMenuScreen() {
            isVoiceActive = false;
            if(recognition) recognition.stop();
            switchScreen('menu-screen');
            verifyKey(); 
            updateCarouselUI();
        }

        function openMenu() { showMenuScreen(); }

        function selectCarouselOption(index) {
            carouselIndex = index;
            updateCarouselUI();
            
            setTimeout(() => {
                if (index === 0) showDashboard();
                if (index === 1) activateVoiceControl();
                if (index === 2) showTranslation();
            }, 300);
        }

        function updateCarouselUI() {
            const buttons = [document.getElementById('c-btn-0'), document.getElementById('c-btn-1'), document.getElementById('c-btn-2')];
            buttons.forEach((btn, i) => {
                if (!btn) return;
                if (i === carouselIndex) {
                    btn.className = "carousel-btn big";
                } else {
                    btn.className = "carousel-btn small";
                }
            });
        }

        window.addEventListener('wheel', (e) => {
            if (document.getElementById('menu-screen').classList.contains('active')) {
                if (e.deltaY > 0) {
                    carouselIndex = Math.min(carouselIndex + 1, 2);
                } else {
                    carouselIndex = Math.max(carouselIndex - 1, 0);
                }
                updateCarouselUI();
            }
        });

        // VOICE CONTROL LOGIC
        function activateVoiceControl() {
            if (db.savedKey.toLowerCase() !== 'gibb') {
                alert("ACCESS DENIED: Valid Key Required for Voice Control.");
                return;
            }
            if (!recognition) {
                alert("Speech Recognition not supported in this browser.");
                return;
            }

            switchScreen('voice-screen');
            document.getElementById('voice-transcript').innerText = '';
            
            const honorific = db.profile.honorific === 'sir' ? 'Sir' : 'Miss';
            isVoiceActive = true;
            
            speak(`Voice Control is active, ${honorific}.`, () => {
                if(isVoiceActive) recognition.start();
            });
        }

        function deactivateVoiceControl() {
            isVoiceActive = false;
            recognition.stop();
            showMenuScreen();
        }

        function processVoiceCommand(cmd) {
            recognition.stop();
            const honorific = db.profile.honorific === 'sir' ? 'Sir' : 'Miss';
            
            if (cmd.includes("deactivate voice control") || cmd.includes("exit") || cmd.includes("stop")) {
                speak("Deactivating Voice Control.", () => {
                    deactivateVoiceControl();
                });
                return;
            }

            let reply = "";
            if (cmd.includes('who made you') || cmd.includes('creator')) {
                reply = `gibbkayyy made me, ${honorific}.`;
            } else if (cmd.includes('hello') || cmd.includes('hi')) {
                reply = `Greetings, ${honorific}. How can I assist you?`;
            } else {
                reply = `Acknowledged. I heard you say: ${cmd}`;
            }

            speak(reply);
        }

        // CHAT LOGIC
        function showDashboard() {
            switchScreen('dashboard-screen');
            loadChatHistory();
        }

        function loadChatHistory() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            const history = db.chatHistory || [];
            
            if (history.length === 0) {
                const honorific = db.profile && db.profile.honorific === 'sir' ? 'Sir' : 'Miss';
                appendMessage(`System Core initialized, ${honorific}. Secure channel established.`, 'gibb', false);
            } else {
                history.forEach(msg => appendMessage(msg.text, msg.sender, false));
            }
        }

        function appendMessage(text, sender, save = true) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            if (save) { db.chatHistory.push({ text, sender }); saveDatabase(); }
        }

        function checkEnter(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            input.value = '';

            setTimeout(() => {
                const honorific = db.profile.honorific === 'sir' ? 'Sir' : 'Miss';
                const lowerText = text.toLowerCase();
                let reply = (lowerText.includes('who made you') || lowerText.includes('creator')) 
                    ? `gibbkayyy made me, ${honorific}.` 
                    : `Acknowledged, ${honorific}. Memory stored.`;
                appendMessage(reply, 'gibb');
            }, 600);
        }

        // TRANSLATION LOGIC (50 Languages)
        function showTranslation() {
            switchScreen('translation-screen');
            executeTranslation();
        }

        function executeTranslation() {
            const text = document.getElementById('source-text').value.trim();
            const langCode = document.getElementById('target-lang-select').value;
            const outputDiv = document.getElementById('translation-output');

            if (!text) {
                outputDiv.innerText = "[Awaiting source input...]";
                return;
            }

            // Using MyMemory public translation API to support instant translation across 50+ languages seamlessly
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${langCode}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data && data.responseData && data.responseData.translatedText) {
                        outputDiv.innerText = data.responseData.translatedText;
                    } else {
                        outputDiv.innerText = "[Translation processing error]";
                    }
                })
                .catch(err => {
                    outputDiv.innerText = "[Network connection error]";
                });
        }

        function logout() {
            sessionStorage.removeItem('gibb_logged_in');
            hasSpokenWelcome = false;
            renderAuthScreen();
            switchScreen('auth-screen');
        }

        function clearProfileData() {
            localStorage.removeItem('gibb_permanent_db');
            db = { profile: null, chatHistory: [], volume: 1.0, savedKey: '' };
            renderAuthScreen();
        }
    </script>
</body>
</html>
